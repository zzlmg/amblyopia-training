<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>僵尸舒尔特 · 弱视训练</title>
<link rel="manifest" href="manifest.json">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{font-family:'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif;
  background:linear-gradient(180deg,#1B5E20 0%,#2E7D32 100%);color:#e8f5e9;
  min-height:100vh;display:flex;flex-direction:column;align-items:center;
  overflow-x:hidden;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
body{padding-bottom:30px}

.top-bar{width:100%;max-width:680px;display:flex;align-items:center;
  justify-content:space-between;padding:16px 20px;flex-shrink:0;position:relative;z-index:101}
.back-link{text-decoration:none;color:#A5D6A7;font-weight:600;font-size:15px;
  display:flex;align-items:center;gap:6px}
.back-link:hover{opacity:0.8}

.game-title{text-align:center;padding:2px 0 4px;flex-shrink:0}
.game-title h1{font-size:22px;color:#FFEB3B;margin:0;text-shadow:2px 2px 4px rgba(0,0,0,0.4)}

.diff-tabs{display:flex;gap:8px;max-width:680px;width:100%;padding:0 20px 10px;flex-shrink:0}
.diff-tab{flex:1;padding:10px 8px;border-radius:12px;border:2px solid #388E3C;
  background:rgba(0,0,0,0.25);color:#a5d6a7;cursor:pointer;text-align:center;
  font-size:13px;font-weight:600;transition:all 0.2s;user-select:none}
.diff-tab.active{background:#4CAF50;color:#fff;border-color:#4CAF50;
  box-shadow:0 0 14px rgba(76,175,80,0.4)}
.diff-tab:hover:not(.active){background:rgba(76,175,80,0.2);border-color:#4CAF50}

.hud{display:flex;align-items:center;justify-content:space-between;
  max-width:680px;width:100%;padding:6px 20px 8px;flex-shrink:0;gap:10px}
.hud-item{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:600;
  background:rgba(0,0,0,0.35);padding:7px 13px;border-radius:10px;color:#e8f5e9}
.hud-icon{font-size:18px}
.hud-value{color:#FFEB3B;font-size:17px;font-weight:800;min-width:22px;text-align:center}
.hud-label{color:#a5d6a7;font-size:11px}
.timer-warn{color:#FF8A65 !important;animation:pulse 0.8s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.5}}

.game-container{position:relative;width:680px;height:520px;max-width:100vw;
  margin:0 auto;overflow:hidden;border-radius:16px;
  border:3px solid #388E3C;box-shadow:0 0 30px rgba(0,0,0,0.4);flex-shrink:0;
  background:#4CAF50}
#gratingBg{position:absolute;top:0;left:0;width:100%;height:100%;z-index:0}
.game-grid{position:absolute;top:8px;left:8px;right:8px;bottom:8px;
  display:grid;z-index:2}

/* zombie cell: flex column so number sits at top, figure fills rest */
.zombie-cell{position:relative;
  background:rgba(27,94,32,0.45);
  border:2px dashed rgba(165,214,167,0.35);border-radius:10px;
  cursor:pointer;transition:all 0.15s;
  display:flex;flex-direction:column;align-items:center;
  justify-content:flex-start;overflow:hidden}
.zombie-cell:hover{background:rgba(27,94,32,0.7);border-color:#FFEB3B;transform:scale(1.04);z-index:3;
  box-shadow:0 4px 16px rgba(255,235,59,0.2)}
.zombie-cell:active{transform:scale(0.93)}
.zombie-cell.done{background:rgba(0,0,0,0.4);border-color:#66BB6A;cursor:default;border-style:solid}
.zombie-cell.done .zombie-killed{display:flex}
.zombie-cell.wrong{animation:shake 0.4s ease}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* zombie figure: fills remaining space in flex column cell */
.zombie-figure{flex:1 1 0;width:72%;min-height:0;display:flex;
  align-items:flex-end;justify-content:center;margin:0 auto}
.zombie-figure img{width:100%;height:100%;object-fit:contain;
  filter:drop-shadow(0 2px 4px rgba(0,0,0,0.35));transition:opacity 0.3s}
.zombie-cell.done .zombie-figure img{opacity:0.2}

/* NUMBER on head — absolute, at ~8% from top (head area) */
.zombie-number{position:absolute;
  top:8%;left:50%;transform:translateX(-50%);
  color:#FF1744;font-weight:900;
  text-shadow:
    2px 2px 0 #fff,-2px -2px 0 #fff,
    2px -2px 0 #fff,-2px 2px 0 #fff,
    0 0 6px rgba(0,0,0,0.35);
  line-height:1;white-space:nowrap;pointer-events:none;
  z-index:6;text-align:center;font-family:'PingFang SC','Microsoft YaHei',sans-serif}

/* killed overlay */
.zombie-killed{display:none;font-size:28px;position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%);z-index:5;
  filter:drop-shadow(0 0 6px #FFEB3B)}

/* hit badge for roadblock / tank */
.hit-badge{position:absolute;bottom:1px;right:2px;
  background:#FF1744;color:#fff;font-size:9px;font-weight:800;
  padding:1px 5px;border-radius:7px;z-index:7;line-height:1.4}

/* hit effect float */
.hit-effect{position:absolute;pointer-events:none;z-index:9;
  font-size:16px;font-weight:900;
  animation:floatUp 0.7s ease-out forwards;
  text-shadow:1px 1px 2px rgba(0,0,0,0.4)}
@keyframes floatUp{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-35px) scale(1.3)}}

.bottom-hint{text-align:center;padding:4px 0;font-size:12px;color:#A5D6A7;flex-shrink:0}

/* overlay */
.overlay{position:fixed;top:0;left:0;width:100%;height:100%;
  background:rgba(0,0,0,0.78);display:flex;align-items:center;justify-content:center;
  z-index:100;flex-direction:column;padding:20px}
.overlay.hidden{display:none}
.overlay-card{background:linear-gradient(145deg,#2d5a2d,#1a3a1a);border-radius:20px;
  padding:28px 26px;max-width:420px;width:100%;text-align:center;
  border:2px solid #4CAF50;box-shadow:0 8px 32px rgba(0,0,0,0.5)}
.overlay-card h2{font-size:21px;margin-bottom:8px;color:#FFEB3B}
.overlay-card .subtitle{font-size:13px;color:#a5d6a7;margin-bottom:12px;line-height:1.7}
.overlay-icon{font-size:52px;margin-bottom:8px;display:block}
.btn-go{background:linear-gradient(180deg,#66BB6A,#388E3C);color:#fff;border:none;
  padding:14px 40px;font-size:18px;font-weight:700;border-radius:30px;cursor:pointer;
  margin-top:12px;box-shadow:0 3px 10px rgba(76,175,80,0.4);transition:all 0.15s}
.btn-go:hover{transform:scale(1.05);box-shadow:0 5px 16px rgba(76,175,80,0.55)}
.btn-go:active{transform:scale(0.95)}

.end-icon{font-size:46px;margin-bottom:6px;display:block}
.stars{font-size:28px;margin:4px 0;letter-spacing:4px}
.result-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.result-stat{background:rgba(0,0,0,0.3);border-radius:10px;padding:10px 8px;border:1px solid #388E3C}
.rs-label{font-size:11px;color:#A5D6A7}.rs-value{font-size:20px;font-weight:800;color:#FFEB3B}
.tip{font-size:12px;color:#FF8A65;margin:8px 0;line-height:1.6}

/* difficulty buttons inside overlay */
.diff-select{display:flex;gap:8px;margin:10px 0 4px;justify-content:center}
.diff-btn{padding:10px 16px;border-radius:10px;border:2px solid #4CAF50;
  background:rgba(255,255,255,0.1);color:#a5d6a7;cursor:pointer;
  font-size:14px;font-weight:600;transition:all 0.2s}
.diff-btn:hover{background:rgba(76,175,80,0.25)}
.diff-btn.active{background:#4CAF50;color:#fff;border-color:#66BB6A;
  box-shadow:0 0 12px rgba(76,175,80,0.4)}

@media(max-width:700px){
  .game-container{width:100vw;height:75vw;border-radius:0;border-left:none;border-right:none}
  .diff-tabs{padding:0 12px 8px}
  .hud{padding:6px 12px 6px}
  .hud-item{padding:6px 10px;font-size:12px}
  .top-bar{padding:12px 16px}
}
</style>
</head>

<div class="top-bar"><a href="index.html" class="back-link">&#8592; 返回科普站</a><a href="index.html#games" class="back-link">&#8592; 训练游戏</a><a href="progress.html" class="back-link">📊 训练进度</a></div>

<div class="game-title">
  <h1>&#x1F9DF; 僵尸舒尔特网格</h1>
</div>

<div class="diff-tabs" id="diffTabs">
  <div class="diff-tab active" data-diff="easy">&#x1F7E2; 简单 3&#xD7;3<br><small>9只普通僵尸</small></div>
  <div class="diff-tab" data-diff="medium">&#x1F7E1; 中等 4&#xD7;4<br><small>4只路障僵尸</small></div>
  <div class="diff-tab" data-diff="hard">&#x1F534; 困难 6&#xD7;6<br><small>路障+铁桶混编</small></div>
</div>

<div class="hud" id="hud">
  <div class="hud-item"><span class="hud-icon">&#x1F4A5;</span><div><span class="hud-value" id="hudScore">0</span><span class="hud-label">得分</span></div></div>
  <div class="hud-item"><span class="hud-icon">&#x1F3AF;</span><div><span class="hud-value" id="hudTarget">1</span><span class="hud-label">下一个</span></div></div>
  <div class="hud-item"><span class="hud-icon">&#x23F1;</span><div><span class="hud-value" id="hudTime">120</span><span class="hud-label">秒</span></div></div>
  <div class="hud-item" style="cursor:pointer" id="hudSound" onclick="toggleSound()"><span class="hud-icon">&#x1F50A;</span><span class="hud-label">音效</span></div>
</div>

<div class="game-container" id="gameContainer">
  <canvas id="gratingBg"></canvas>
  <div class="game-grid" id="gameGrid"></div>
</div>

<div class="bottom-hint">&#x1F446; 按数字顺序点击 · 路障/铁桶需点两次破防</div>

<div class="overlay" id="startOverlay">
  <div class="overlay-card">
    <span class="overlay-icon">&#x1F9DF;</span>
    <h2>僵尸舒尔特训练</h2>
    <p class="subtitle">网格中混入不同僵尸<br>按编号顺序依次消灭！<br>普通僵尸点1下，路障/铁桶点2下</p>
    <div class="diff-select" id="diffSelect">
      <button class="diff-btn active" data-diff="easy">3x3 简单 · 9僵尸</button>
      <button class="diff-btn" data-diff="medium">4x4 中等 · 4路障</button>
      <button class="diff-btn" data-diff="hard">6x6 困难 · 铁桶混编</button>
    </div>
    <button class="btn-go" onclick="showCover()">&#x1F3AE; 开始训练</button>
  </div>
</div>

<div class="overlay hidden" id="coverOverlay">
  <div class="overlay-card">
    <span class="overlay-icon">&#x1F453;</span>
    <h2>训练前准备</h2>
    <p class="subtitle">
      请佩戴矫正眼镜，按医嘱遮盖优势眼<br>
      屏幕距离眼睛 30-40cm<br>
      环境光线保持 400-600lux<br>
      单局 2 分钟，全天不超过 15 分钟
    </p>
    <button class="btn-go" onclick="startGame()">&#x2705; 准备好了！</button>
  </div>
</div>

<div class="overlay hidden" id="endOverlay">
  <div class="overlay-card" id="endCard"></div>
</div>

(function init(){
  var c=document.getElementById('gratingBg'),gc=document.getElementById('gameContainer');
  c.width=gc.clientWidth;c.height=gc.clientHeight;
  window.addEventListener('resize',function(){
    c.width=gc.clientWidth;c.height=gc.clientHeight;
    if(!running)drawGratingStatic();
  });
  function selectDiff(diff){
    if(running)return;
    cfg=DIFFICULTY[diff];totalCells=cfg.n*cfg.n;
    document.querySelectorAll('.diff-btn,.diff-tab').forEach(function(x){x.classList.remove('active');});
    document.querySelectorAll('[data-diff="'+diff+'"]').forEach(function(x){x.classList.add('active');});
    buildGrid();
  }
  document.querySelectorAll('.diff-tab').forEach(function(t){
    t.addEventListener('click',function(){selectDiff(t.dataset.diff);});
  });
  document.querySelectorAll('.diff-btn').forEach(function(b){
    b.addEventListener('click',function(){selectDiff(b.dataset.diff);});
  });
  buildGrid();drawGratingStatic();
})();

function buildGrid(){
  var g=document.getElementById('gameGrid'),n=cfg.n;
  g.style.setProperty('grid-template-columns','repeat('+n+', 1fr)');
  g.style.setProperty('grid-template-rows','repeat('+n+', 1fr)');
  var gap = n<=3 ? 5 : n<=4 ? 3 : 1;
  g.style.gap = gap+'px';
  g.innerHTML='';
  for(var i=0;i<totalCells;i++){
    var cell=document.createElement('div');
    cell.className='zombie-cell';cell.dataset.index=i;
    cell.addEventListener('click',function(e){onCellClick(e.currentTarget);});
    g.appendChild(cell);
  }
  requestAnimationFrame(function(){applyNumberSize();});
}

function applyNumberSize(){
  var cell=document.querySelector('.zombie-cell');
  if(!cell)return;
  var w=cell.offsetWidth, h=cell.offsetHeight;
  var fontSize=Math.max(10,Math.min(38,Math.floor(Math.min(w,h)*0.30)));
  document.querySelectorAll('.zombie-number').forEach(function(n){
    n.style.fontSize=fontSize+'px';
  });
}

function initAudio(){
  if(audioCtx)return;
  try{audioCtx=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}
}
function playBeep(f,d,t,v){
  if(!audioCtx||!soundOn)return;t=t||'square';v=v||0.08;
  var o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.type=t;o.frequency.setValueAtTime(f,audioCtx.currentTime);
  g.gain.setValueAtTime(v,audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+d);
  o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+d);
}
function sndKill(){playBeep(800,0.1,'square',0.07);setTimeout(function(){playBeep(1100,0.09,'sine',0.06)},40);}
function sndMiss(){playBeep(150,0.2,'sawtooth',0.05);}
function sndArmor(){playBeep(320,0.1,'square',0.14);setTimeout(function(){playBeep(200,0.13,'square',0.11)},50);}
function sndDone(){for(var i=0;i<4;i++){setTimeout(function(){playBeep(523+i*130,0.12,'sine',0.08)},i*100);}}
function sndGameover(){playBeep(400,0.2,'triangle',0.09);setTimeout(function(){playBeep(280,0.27,'triangle',0.07)},200);}
function toggleSound(){
  soundOn=!soundOn;
  document.getElementById('hudSound').querySelector('.hud-icon').textContent=soundOn?'\u{1F50A}':'\u{1F507}';
  if(soundOn)initAudio();
}

function drawGratingStatic(){
  var c=document.getElementById('gratingBg'),w=c.width,h=c.height,G=GRATING;
  var ctx=c.getContext('2d');ctx.clearRect(0,0,w,h);
  ctx.save();ctx.translate(w/2,h/2);ctx.rotate(-G.angle);
  var d=Math.sqrt(w*w+h*h),dx=G.stripeWidth*2;
  for(var x=-d;x<d;x+=dx){ctx.fillStyle='rgba(0,0,0,'+G.opacity+')';ctx.fillRect(x,-d,G.stripeWidth,d*2);}
  ctx.restore();
}
function drawGrating(ts){
  var c=document.getElementById('gratingBg'),w=c.width,h=c.height,G=GRATING;
  var ctx=c.getContext('2d');
  if(!lastGratingTime)lastGratingTime=ts;
  var dt=(ts-lastGratingTime)/1000;lastGratingTime=ts;
  if(dt>0.1)dt=0.016;
  gratingOffset=(gratingOffset+G.speed*dt)%(G.stripeWidth*2*Math.SQRT2);
  ctx.clearRect(0,0,w,h);ctx.save();ctx.translate(w/2,h/2);ctx.rotate(-G.angle);
  var d=Math.sqrt(w*w+h*h),x0=-d+(gratingOffset%(G.stripeWidth*2));
  while(x0<d){ctx.fillStyle='rgba(0,0,0,'+G.opacity+')';ctx.fillRect(x0,-d,G.stripeWidth,d*2);x0+=G.stripeWidth*2;}
  ctx.restore();
  if(running)requestAnimationFrame(drawGrating);
}

function generateZombies(){
  var n=cfg.n,total=n*n,positions=[];
  for(var i=0;i<total;i++)positions.push(i);
  for(var i=positions.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=positions[i];positions[i]=positions[j];positions[j]=t;}
  var data=[],idx=0;
  for(var i=0;i<cfg.numHard;i++)data.push({pos:positions[idx++],num:0,type:'roadblock',hits:0});
  for(var i=0;i<cfg.numTank;i++)data.push({pos:positions[idx++],num:0,type:'tank',hits:0});
  for(;idx<total;idx++)data.push({pos:positions[idx],num:0,type:'normal',hits:0});
  var nums=[];for(var i=1;i<=total;i++)nums.push(i);
  for(var i=nums.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=nums[i];nums[i]=nums[j];nums[j]=t;}
  for(var i=0;i<data.length;i++)data[i].num=nums[i];
  return data;
}

function renderZombies(){
  var cells=document.querySelectorAll('.zombie-cell');
  cells.forEach(function(c){c.className='zombie-cell';c.innerHTML='';c.dataset.num='';c.dataset.type='';c.dataset.hits='0';});
  zombies.forEach(function(z){
    var cell=cells[z.pos];
    // figure wrapper with image
    var fig=document.createElement('div');
    fig.className='zombie-figure';
    var img=document.createElement('img');img.src=getImg(z.type);
    img.draggable=false;fig.appendChild(img);
    cell.appendChild(fig);
    // number ON the head — absolute, at top center of cell
    var nd=document.createElement('div');
    nd.className='zombie-number';
    nd.textContent=z.num;
    cell.appendChild(nd);
    // killed overlay
    var kl=document.createElement('span');kl.className='zombie-killed';kl.textContent='\u{1F4A5}';cell.appendChild(kl);
    // hit badge for armored zombies
    if(z.type!=='normal'){
      var b=document.createElement('div');b.className='hit-badge';b.id='badge-'+z.pos;b.textContent='\u00D72';cell.appendChild(b);
    }
    cell.dataset.num=z.num;cell.dataset.type=z.type;cell.dataset.hits='0';
  });
  applyNumberSize();
}

function showCover(){
  initAudio();document.getElementById('startOverlay').classList.add('hidden');
  document.getElementById('coverOverlay').classList.remove('hidden');
}
function startGame(){
  document.getElementById('coverOverlay').classList.add('hidden');
  document.getElementById('endOverlay').classList.add('hidden');
  totalCells = cfg.n * cfg.n;
  score=0;timeLeft=120;currentTarget=1;running=true;gameOver=false;
  correctClicks=0;totalClicks=0;gratingOffset=0;lastGratingTime=0;
  updateHUD();buildGrid();
  zombies=generateZombies();renderZombies();
  clearInterval(timerId);timerId=setInterval(tick,1000);
  requestAnimationFrame(drawGrating);
}
function tick(){timeLeft--;updateHUD();if(timeLeft<=0)endGame(false);}
function updateHUD(){
  document.getElementById('hudScore').textContent=score;
  document.getElementById('hudTarget').textContent=currentTarget;
  var te=document.getElementById('hudTime');te.textContent=timeLeft;
  te.className='hud-value'+(timeLeft<=15?' timer-warn':'');
}

function onCellClick(cell){
  if(!running||gameOver)return;
  var num=parseInt(cell.dataset.num);if(!num)return;
  totalClicks++;
  if(num!==currentTarget){sndMiss();cell.classList.add('wrong');setTimeout(function(){cell.classList.remove('wrong');},400);return;}
  var type=cell.dataset.type,hits=parseInt(cell.dataset.hits||'0');
  if(type==='roadblock'||type==='tank'){
    if(hits===0){cell.dataset.hits='1';sndArmor();showHitEffect(cell,'\u{1F4A5} 破防！');
      var b=document.getElementById('badge-'+cell.dataset.pos);if(b){b.style.opacity='0.4';b.textContent='\u00D71';}return;
    }
  }
  correctClicks++;sndKill();showHitEffect(cell,'+10');cell.classList.add('done');
  score+=10;currentTarget++;updateHUD();
  if(currentTarget>totalCells)endGame(true);
}

function showHitEffect(cell,text){
  var con=document.getElementById('gameContainer'),cr=con.getBoundingClientRect(),tr=cell.getBoundingClientRect();
  var el=document.createElement('div');el.className='hit-effect';el.textContent=text;
  el.style.left=(tr.left-cr.left+tr.width/2)+'px';el.style.top=(tr.top-cr.top)+'px';
  el.style.color=text.indexOf('+')>=0?'#FFEB3B':'#FF8A65';con.appendChild(el);
  setTimeout(function(){el.remove();},700);
}

function endGame(finished){
  running=false;gameOver=true;clearInterval(timerId);
  var acc=totalClicks>0?Math.round((correctClicks/totalClicks)*100):0,tt=120-timeLeft;
  var stars,icon,rating;
  if(finished&&acc>=95)     {stars=3;icon='\u{2B50}';rating='S \u00B7 完美清理！';}
  else if(acc>=85)          {stars=2;icon='\u{1F31F}';rating='A \u00B7 非常棒！';}
  else if(acc>=65)          {stars=1;icon='\u{1F4AA}';rating='B \u00B7 继续加油';}
  else                       {stars=0;icon='\u{1F9DF}';rating='C \u00B7 再接再厉';}
  var se='\u2B50\u2B50\u2B50';
  document.getElementById('endCard').innerHTML=
    '<span class="end-icon">'+icon+'</span>'+
    '<h2>'+(finished?'\u5168\u90E8\u6E05\u9664\uFF01':'\u65F6\u95F4\u5230')+'</h2>'+
    '<div class="stars">'+se.substring(0,stars*2)+'</div>'+
    '<p style="font-size:0.85rem;color:#FFEB3B;font-weight:600;margin-bottom:8px">'+rating+' \u2014 '+cfg.label+'</p>'+
    '<div class="result-stats">'+
      '<div class="result-stat"><div class="rs-label">\u5F97\u5206</div><div class="rs-value">'+score+'</div></div>'+
      '<div class="result-stat"><div class="rs-label">\u51C6\u786E\u7387</div><div class="rs-value">'+acc+'%</div></div>'+
      '<div class="result-stat"><div class="rs-label">\u6B63\u786E</div><div class="rs-value">'+correctClicks+'/'+totalCells+'</div></div>'+
      '<div class="result-stat"><div class="rs-label">\u7528\u65F6</div><div class="rs-value">'+tt+'s</div></div>'+
    '</div>'+
    '<p class="tip">\uD83E\uDD01\u200D\u2695\uFE0F 请远眺5分钟，放松眼睛</p>'+
    '<button class="btn-go" onclick="restartGame()">\uD83D\uDD04 再玩一次</button>';
  document.getElementById('endOverlay').classList.remove('hidden');
  saveProgress(score,acc,tt);
}

function restartGame(){
  document.getElementById('endOverlay').classList.add('hidden');
  document.getElementById('coverOverlay').classList.remove('hidden');
}

function saveProgress(sc,acc,t){
  try{
    var k='amblyopia_progress',d=JSON.parse(localStorage.getItem(k)||'{}');
    if(!d['zombie-schulte-grid'])d['zombie-schulte-grid']={};
    var g=d['zombie-schulte-grid'];
    g.bestScore=Math.max(g.bestScore||0,sc);g.bestAcc=Math.max(g.bestAcc||0,acc);
    g.bestTime=Math.min(g.bestTime||999,t);g.lastPlayed=new Date().toISOString();
    g.plays=(g.plays||0)+1;localStorage.setItem(k,JSON.stringify(d));
  }catch(e){}
}

function backToSelect(){
  document.getElementById('endOverlay').classList.add('hidden');
  document.getElementById('startOverlay').classList.remove('hidden');
}
</script>
<script>if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js')}</script>
</body>
</html>
