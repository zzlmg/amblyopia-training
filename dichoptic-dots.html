<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>双眼探点 · 弱视脱抑制训练</title>
<link rel="manifest" href="manifest.json">
<style>
:root { --blue:#F9A825; --blue-light:#FFF8E1; --pink:#EF6C00; --pink-light:#FFF3E0;
  --green:#388E3C; --green-light:#E8F5E9; --purple:#1976D2; --purple-light:#E3F2FD;
  --text:#3E2723; --text-muted:#8D6E63; --bg:#FFFBF0; --card-bg:#fff; --radius:24px; --radius-sm:16px; }
*{margin:0;padding:0;box-sizing:border-box}
html,body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);height:100vh;width:100vw;overflow:hidden;
  display:flex;flex-direction:column;user-select:none;-webkit-user-select:none;touch-action:manipulation}

.top-bar{position:absolute;top:0;left:0;right:0;height:38px;z-index:11;
  background:rgba(0,0,0,0.18);backdrop-filter:blur(6px);
  display:flex;align-items:center;justify-content:space-between;padding:0 10px}
.back-link{text-decoration:none;color:#FFD54F;font-weight:600;font-size:13px;display:flex;align-items:center;gap:3px}
.hud{display:flex;align-items:center;gap:8px;color:#fff;font-size:13px;font-weight:700}
.hud-timer{background:rgba(255,255,255,0.2);padding:2px 8px;border-radius:8px;display:none;min-width:40px;text-align:center}
.hud-score{background:rgba(255,215,79,0.3);padding:2px 8px;border-radius:8px;display:none}
.hud-select{background:rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.2);color:#fff;font-size:12px;padding:2px 4px;border-radius:6px;font-family:inherit;cursor:pointer}
.sound-btn{background:none;border:none;color:#fff;font-size:14px;cursor:pointer;padding:1px 3px;line-height:1}

.canvas-wrap{flex:1;width:100%;position:relative;overflow:hidden;background:#3a3a3a;display:flex;align-items:center;justify-content:center}
canvas{position:absolute;display:block;max-width:100%;max-height:100%;touch-action:manipulation}
#cL{z-index:1}#cR{z-index:2}

.mascot{position:absolute;right:10px;bottom:10px;z-index:10;transition:all 0.4s}
.mascot img{width:56px;height:56px;animation:mascot-float 3s ease-in-out infinite}
.mascot.celebrate img{animation:mascot-pop 0.6s ease-out}
@keyframes mascot-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes mascot-pop{0%{transform:scale(0.8);opacity:0}50%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}

.mode-hint{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);z-index:12;
  background:rgba(0,0,0,0.45);color:#FFD54F;padding:4px 14px;border-radius:10px;font-size:12px;font-weight:600;display:none}

.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px}
.overlay.hidden{display:none}
.overlay-card{background:var(--card-bg);border-radius:var(--radius);padding:28px 24px;max-width:440px;width:100%;text-align:center;border:2px solid #f0f0f5;box-shadow:0 6px 30px rgba(0,0,0,0.12)}
.overlay-card h2{font-size:22px;margin-bottom:6px}
.overlay-card p{font-size:13px;color:var(--text-muted);line-height:1.7;margin:6px 0}
.overlay-card ul{text-align:left;font-size:13px;color:var(--text-muted);line-height:1.8;padding:0 16px;margin:8px 0;list-style:none}
.overlay-card ul li::before{content:'· ';color:var(--blue);font-weight:700}
.overlay-card ul li strong{color:var(--text)}

.diff-select{display:flex;gap:8px;margin:14px 0;justify-content:center;flex-wrap:wrap}
.diff-btn{padding:7px 16px;border-radius:24px;border:2px solid #e0e0e0;background:transparent;font-size:13px;font-weight:600;cursor:pointer;transition:all 0.2s;color:var(--text-muted);font-family:inherit}
.diff-btn:hover{border-color:var(--blue);color:var(--blue)}
.diff-btn.active{background:var(--blue);color:#fff;border-color:var(--blue)}

.glasses-box{background:#FFF8E1;border:2px solid #FFE082;border-radius:14px;padding:12px 14px;margin:12px 0;font-size:12px;color:#F57C00;font-weight:600;line-height:1.7;text-align:left}
.btn-go{display:inline-block;padding:12px 36px;border-radius:30px;font-size:16px;font-weight:700;cursor:pointer;border:none;background:linear-gradient(135deg,var(--blue),var(--pink));color:#fff;box-shadow:0 4px 20px rgba(249,168,37,0.4);transition:transform 0.15s;font-family:inherit;margin-top:10px}
.btn-go:hover{transform:translateY(-2px)}
.btn-go:active{transform:scale(0.96)}

.result-score{font-size:44px;font-weight:900;color:var(--blue);margin:6px 0}
@media(max-width:500px){.overlay-card{padding:22px 16px}}
</style>
</head>
<body>

<div class="top-bar">
  <a href="index.html#games" class="back-link">&#8592; 返回游戏</a>
  <div class="hud">
    <span class="hud-score" id="scoreHud">0</span>
    <span class="hud-timer" id="timerHud">2:00</span>
    <select class="hud-select" id="weakEyeSelect" onchange="updateSettings()">
      <option value="right">👁 弱视眼·右</option>
      <option value="left">👁 弱视眼·左</option>
    </select>
    <select class="hud-select" id="modeSelect" onchange="updateSettings()">
      <option value="mixed">一起找</option>
      <option value="red">右眼练练</option>
      <option value="cyan">左眼练练</option>
    </select>
    <button class="sound-btn" id="soundBtn" onclick="toggleSound()">🔊</button><a href="contact.html" style="font-size:15px;text-decoration:none;margin-left:6px;color:var(--blue)" title="联系我们">📬</a>
  </div>
</div>

<div class="canvas-wrap" id="canvasWrap">
  <canvas id="cL"></canvas>
  <canvas id="cR"></canvas>
  <div class="mode-hint" id="modeHint"></div>
  <div class="mascot" id="mascot"><img src="mascot/sunflower-smile.png" alt="小葵" id="mascotImg"></div>
</div>

<!-- Start -->
<div class="overlay" id="startOverlay">
  <div class="overlay-card">
    <h2>🎯 双眼探点</h2>
    <p>脱抑制入门训练 · 双眼分工找圆点</p>
    <div class="glasses-box">
      <strong>⚠ 必须佩戴的设备</strong><br>
      ① 矫正眼镜（日常戴镜）先戴上<br>
      ② 红蓝眼镜（左蓝滤/右红滤）叠戴在外面<br>
      &nbsp;&nbsp;· 左眼蓝滤片 → 只看青色点<br>
      &nbsp;&nbsp;· 右眼红滤片 → 只看红色点<br>
      &nbsp;&nbsp;· 灰点双眼都可见（干扰）<br>
      ③ 没红蓝镜？网店搜"红蓝3D眼镜"，几元一副<br>
      ④ 验镜：遮左眼看→只有红点；遮右眼看→只有青点
    </div>
    <div class="diff-select" id="diffSelect">
      <button class="diff-btn active" data-diff="easy">简单</button>
      <button class="diff-btn" data-diff="medium">中等</button>
      <button class="diff-btn" data-diff="hard">困难</button>
    </div>
    <p style="font-size:12px;color:var(--text-muted)">屏距30-40cm · 光线400-600 lux · 2分钟/局 · 全天≤15分钟</p>
    <button class="btn-go" onclick="startGame()">准备好了，开始！</button>
  </div>
</div>

<!-- End -->
<div class="overlay hidden" id="endOverlay">
  <div class="overlay-card" id="endCard"></div>
</div>

<script>
var BASE_W=560, BASE_H=400, G_BASE=200;
var DIFFICULTY={
  easy:{label:'简单',interval:1400,maxDots:3,grayCount:0,timeout:2500,radius:40,g:200},
  medium:{label:'中等',interval:1000,maxDots:5,grayCount:1,timeout:2000,radius:30,g:170},
  hard:{label:'困难',interval:700,maxDots:8,grayCount:2,timeout:1500,radius:24,g:140}
};
var currentDiff='easy', cfg=DIFFICULTY[currentDiff];
var weakEye='right', mode='mixed', score=0, hitCount=0, totalCount=0;
var running=false, timeLeft=120, timerId=null, dots=[], spawnTimer=null;
var audioCtx=null, soundOn=true, dominantGain=G_BASE;
var streak=0, canvasWrap, cL, cR, ctxL, ctxR, loopId;

/* ── Canvas setup ── */
function resizeCanvas(){
  canvasWrap=document.getElementById('canvasWrap');
  var rect=canvasWrap.getBoundingClientRect(), w=rect.width, h=rect.height;
  var dpr=window.devicePixelRatio||1;
  [['cL','ctxL'],['cR','ctxR']].forEach(function(p){
    var c=document.getElementById(p[0]); c.width=w*dpr;c.height=h*dpr;c.style.width=w+'px';c.style.height=h+'px';
    window[p[1]]=c.getContext('2d');
    window[p[1]].setTransform(1,0,0,1,0,0);
    var s=Math.min(dpr*w/BASE_W,dpr*h/BASE_H);
    window[p[1]].translate((dpr*w-s*BASE_W)/2,(dpr*h-s*BASE_H)/2);
    window[p[1]].scale(s,s);
  });
  cL=document.getElementById('cL');cR=document.getElementById('cR');ctxL=cL.getContext('2d');ctxR=cR.getContext('2d');
}
resizeCanvas();window.addEventListener('resize',function(){resizeCanvas();if(running)drawAll()});

/* ── Audio ── */
function initAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)()}
function playPop(){if(!audioCtx||!soundOn)return;try{var o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.setValueAtTime(880,audioCtx.currentTime);o.frequency.exponentialRampToValueAtTime(1200,audioCtx.currentTime+0.08);g.gain.setValueAtTime(0.08,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+0.08);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+0.08)}catch(e){}}
function playBad(){if(!audioCtx||!soundOn)return;try{var o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='square';o.frequency.value=180;g.gain.setValueAtTime(0.05,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+0.12);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+0.12)}catch(e){}}
function playMiss(){if(!audioCtx||!soundOn)return;try{var o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.value=300;g.gain.setValueAtTime(0.04,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+0.15);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+0.15)}catch(e){}}
function toggleSound(){soundOn=!soundOn;document.getElementById('soundBtn').textContent=soundOn?'🔊':'🔇';if(soundOn)initAudio()}

/* ── Settings ── */
function updateSettings(){
  weakEye=document.getElementById('weakEyeSelect').value;
  mode=document.getElementById('modeSelect').value;
  localStorage.setItem('dichoptic_weakEye',weakEye);
  localStorage.setItem('dichoptic_mode',mode);
  updateHint();
}
function loadSettings(){
  var we=localStorage.getItem('dichoptic_weakEye');if(we)weakEye=we;
  var m=localStorage.getItem('dichoptic_mode');if(m)mode=m;
  document.getElementById('weakEyeSelect').value=weakEye;
  document.getElementById('modeSelect').value=mode;
}
loadSettings();

function updateHint(){
  var h=document.getElementById('modeHint');
  if(mode==='red')h.textContent='🔴 右眼练练 · 只有红点出现';else if(mode==='cyan')h.textContent='🔵 左眼练练 · 只有青点出现';else h.textContent='';
  h.style.display=(mode==='mixed')?'none':'block';
}

/* ── Dot management ── */
function spawnDot(){
  var types=[];
  if(mode==='red')types=['red'];else if(mode==='cyan')types=['cyan'];else types=['red','cyan'];
  for(var i=0;i<cfg.grayCount;i++)types.push('gray');

  // Count alive
  var alive=dots.filter(function(d){return d.alive}).length;
  if(alive>=cfg.maxDots)return;

  var type=types[Math.floor(Math.random()*types.length)];
  var r=cfg.radius, m=r+4;
  var x=m+Math.random()*(BASE_W-m*2), y=m+Math.random()*(BASE_H-m*2);
  var g=cfg.g;
  if(mode==='mixed'&&type!=='gray'){
    if((weakEye==='right'&&type==='red')||(weakEye==='left'&&type==='cyan')){
      g=dominantGain; // weak eye side gets potentially attenuated gain if dominantGain decreased
    }
    if((weakEye==='left'&&type==='red')||(weakEye==='right'&&type==='cyan')){
      // dominant eye — apply attenuation
      g=dominantGain;
    }
  }
  // Actually: dominantGain controls the NON-weak eye's signal strength
  // weak eye always at cfg.g
  var weakG=cfg.g, domG=Math.max(80,dominantGain);
  if(mode==='mixed'&&type!=='gray'){
    if((weakEye==='right'&&type==='red')||(weakEye==='left'&&type==='cyan'))g=weakG;
    else g=domG;
  }

  dots.push({x:x,y:y,r:r,type:type,g:g,spawned:Date.now(),alive:true,anim:0});
}

function drawAll(){
  ctxL.clearRect(0,0,BASE_W,BASE_H);ctxL.fillStyle='#3a3a3a';ctxL.fillRect(0,0,BASE_W,BASE_H);
  ctxR.clearRect(0,0,BASE_W,BASE_H);

  dots.forEach(function(d){
    if(!d.alive&&d.anim<=0)return;
    var a=1, s=1, r=d.r;
    if(d.anim>0){
      var t=d.anim;
      if(t>0.15){s=1+0.3*(t/0.2);a=1-t/0.2;} // dying: scale up then shrink
      else{s=1-0.8*(t/0.15);a=t/0.15*0.6;} // spawning: grow in
      r=d.r*s;
      if(d.anim>0.2)d.alive=false,d.anim=0;
    }

    // Draw on appropriate canvas
    if(d.type==='cyan'){
      ctxL.fillStyle='rgba(0,'+d.g+','+d.g+','+a+')';ctxL.beginPath();ctxL.arc(d.x,d.y,r,0,Math.PI*2);ctxL.fill();
    }else if(d.type==='red'){
      ctxR.fillStyle='rgba('+d.g+',0,0,'+a+')';ctxR.beginPath();ctxR.arc(d.x,d.y,r,0,Math.PI*2);ctxR.fill();
    }else if(d.type==='gray'){
      var ga=Math.round(128*a);
      ctxL.fillStyle='rgba('+ga+','+ga+','+ga+','+a+')';ctxL.beginPath();ctxL.arc(d.x,d.y,r,0,Math.PI*2);ctxL.fill();
      ctxR.fillStyle='rgba('+ga+','+ga+','+ga+','+a+')';ctxR.beginPath();ctxR.arc(d.x,d.y,r,0,Math.PI*2);ctxR.fill();
    }
  });
}

/* ── Adaptive ── */
function onHit(){streak++;if(streak>=6){adaptDown()}else if(streak<=-3)streak=0}
function onMiss(){streak--;if(streak<=-3){adaptUp()}}
function adaptDown(){streak=0;
  if(dominantGain>100){dominantGain=Math.max(80,dominantGain-30);} // reduce dominant eye signal
  if(currentDiff==='hard')cfg.timeout=Math.max(800,cfg.timeout-150);
  else if(currentDiff==='medium')cfg.maxDots=Math.min(8,cfg.maxDots+1);
  else cfg.interval=Math.max(500,cfg.interval-150);
}
function adaptUp(){streak=0;
  dominantGain=Math.min(G_BASE,dominantGain+20);
  if(currentDiff==='hard')cfg.timeout=Math.min(2500,cfg.timeout+150);
  else if(currentDiff==='medium')cfg.maxDots=Math.max(3,cfg.maxDots-1);
  else cfg.interval=Math.min(2000,cfg.interval+150);
}

/* ── Click ── */
function handleClick(clientX,clientY){
  if(!running)return;
  var rect=cL.getBoundingClientRect();
  var lx=(clientX-rect.left)/rect.width*BASE_W, ly=(clientY-rect.top)/rect.height*BASE_H;
  if(lx<0||lx>BASE_W||ly<0||ly>BASE_H)return;

  // Find nearest alive dot
  var hit=-1, bestDist=50;
  for(var i=dots.length-1;i>=0;i--){
    if(!dots[i].alive)continue;
    var dist=Math.hypot(lx-dots[i].x,ly-dots[i].y);
    if(dist<dots[i].r+8&&dist<bestDist){hit=i;bestDist=dist}
  }
  if(hit<0)return;

  var d=dots[hit];d.alive=false;d.anim=0.2;totalCount++;
  if(d.type==='gray'){
    // Neutral — no score change
    playBad();setMascot('worry');
  }else{
    score+=10;hitCount++;
    playPop();setMascot('celebrate');onHit();
    document.getElementById('scoreHud').textContent='⭐'+score;
  }
  // Remove dot after anim
  setTimeout(function(){d.anim=0},220);
}

function checkTimeout(now){
  dots.forEach(function(d){
    if(!d.alive)return;
    if(now-d.spawned>cfg.timeout){d.alive=false;d.anim=0.3;totalCount++;playMiss();onMiss()}
  });
}

cR.addEventListener('pointerdown',function(e){e.preventDefault();handleClick(e.clientX,e.clientY)});
cR.addEventListener('touchstart',function(e){e.preventDefault();for(var t of e.changedTouches)handleClick(t.clientX,t.clientY)},{passive:false});

/* ── Mascot ── */
function setMascot(emotion){
  var img=document.getElementById('mascotImg'), el=document.getElementById('mascot');
  el.classList.remove('celebrate');img.src='mascot/sunflower-'+emotion+'.png';
  img.onerror=function(){img.style.display='none'};img.onload=function(){img.style.display='block'};
  if(emotion==='celebrate'){el.classList.add('celebrate');setTimeout(function(){el.classList.remove('celebrate')},800)}
}

/* ── Game loop ── */
function gameLoop(ts){
  if(!running)return;
  // Update dot animations
  dots.forEach(function(d){if(d.anim>0)d.anim-=0.016;if(d.anim<0)d.anim=0});
  // Remove dead dots
  dots=dots.filter(function(d){return d.alive||d.anim>0});
  checkTimeout(Date.now());drawAll();loopId=requestAnimationFrame(gameLoop);
}

/* ── Spawn timer ── */
function spawnLoop(){if(!running)return;spawnDot();spawnTimer=setTimeout(spawnLoop,cfg.interval)}

/* ── Timer ── */
function fmtTime(s){var m=Math.floor(s/60),sec=s%60;return m+':'+(sec<10?'0':'')+sec}
function tick(){if(!running)return;timeLeft--;document.getElementById('timerHud').textContent=fmtTime(timeLeft);if(timeLeft<=30)document.getElementById('timerHud').style.color='#FFD54F';if(timeLeft<=0)endGame()}

/* ── Start / End ── */
function startGame(){
  initAudio();if(!audioCtx){var a=new(window.AudioContext||window.webkitAudioContext)();a.resume();audioCtx=a}
  cfg=DIFFICULTY[currentDiff];cfg.maxDots=DIFFICULTY[currentDiff].maxDots;cfg.interval=DIFFICULTY[currentDiff].interval;cfg.timeout=DIFFICULTY[currentDiff].timeout;
  score=0;hitCount=0;totalCount=0;streak=0;dominantGain=G_BASE;
  dots=[];running=true;timeLeft=120;
  document.getElementById('startOverlay').classList.add('hidden');
  document.getElementById('endOverlay').classList.add('hidden');
  document.getElementById('scoreHud').textContent='⭐0';
  document.getElementById('scoreHud').style.display='inline-block';
  document.getElementById('timerHud').style.display='inline-block';
  document.getElementById('timerHud').textContent='2:00';
  document.getElementById('timerHud').style.color='#fff';
  updateHint();setMascot('smile');
  drawAll();loopId=requestAnimationFrame(gameLoop);spawnTimer=setTimeout(spawnLoop,300);
  timerId=setInterval(tick,1000);
}
function endGame(){
  running=false;if(timerId){clearInterval(timerId);timerId=null}if(spawnTimer){clearTimeout(spawnTimer)}
  if(loopId)cancelAnimationFrame(loopId);
  document.getElementById('scoreHud').style.display='none';document.getElementById('timerHud').style.display='none';document.getElementById('modeHint').style.display='none';
  var acc=totalCount>0?Math.round(hitCount/totalCount*100):0;
  var grade=acc>=80?'🌻 太棒了！双眼在合作！':acc>=50?'💪 不错，继续分开练！':'🌱 刚起步没关���，多练！';
  document.getElementById('endCard').innerHTML='<h2>训练结束</h2><div class="result-score">'+score+'</div><p>分</p><p>命中 '+hitCount+' / '+totalCount+' 次 · 准确率 '+acc+'%</p><p style="font-size:16px;margin:8px 0">'+grade+'</p><div style="background:#FFF8E1;border:2px solid #FFE082;border-radius:14px;padding:12px;margin:12px 0;font-size:12px;color:#F57C00;line-height:1.6">👁 远眺窗外2-5分钟休息<br>红蓝眼镜训练每次≤15分钟<br>结束需远眺放松</div><button class="btn-go" onclick="startGame()">再来一局</button><p style="margin-top:12px"><a href="index.html" style="color:var(--blue);font-size:13px;font-weight:600;text-decoration:none">← 返回首页</a></p>';
  document.getElementById('endOverlay').classList.remove('hidden');
  setMascot(acc>=80?'celebrate':acc>=50?'cheer':'smile');
  ctxL.fillStyle='#3a3a3a';ctxL.fillRect(0,0,BASE_W,BASE_H);ctxR.clearRect(0,0,BASE_W,BASE_H);
}

document.querySelectorAll('#diffSelect .diff-btn').forEach(function(b){
  b.addEventListener('click',function(){
    document.querySelectorAll('#diffSelect .diff-btn').forEach(function(x){x.classList.remove('active')});
    b.classList.add('active');currentDiff=b.dataset.diff;
  });
});
ctxL.fillStyle='#3a3a3a';ctxL.fillRect(0,0,BASE_W,BASE_H);
</script>
<script>if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js')}</script>
</body>
</html>
