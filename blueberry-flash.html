<link rel="manifest" href="manifest.json"><style>*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;background:#000;color:#fff;height:100vh;width:100vw;overflow:hidden;display:flex;flex-direction:column;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.top-bar{position:absolute;top:0;left:0;right:0;height:38px;z-index:10;background:rgba(0,0,0,0.3);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:space-between;padding:0 12px}
.back-link{text-decoration:none;color:#A5D6A7;font-weight:600;font-size:15px;display:flex;align-items:center;gap:6px}.back-link:hover{opacity:0.8}.top-bar-right{display:flex;align-items:center;gap:10px}.timer-display{font-size:14px;font-weight:700;color:#FFEB3B;background:rgba(255,255,255,0.08);border-radius:10px;padding:3px 10px;min-width:50px;text-align:center}.sound-btn{cursor:pointer;font-size:16px;padding:2px 4px;border-radius:6px;background:rgba(255,255,255,0.08);width:28px;height:28px;display:flex;align-items:center;justify-content:center}

.hud{display:none}



.game-wrap{flex:1;width:100%;position:relative;overflow:hidden;border:2px solid rgba(85,85,85,0.25);box-shadow:0 0 30px rgba(255,255,255,0.04);background:#000;margin-top:38px}
.overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);display:flex;align-items:center;justify-content:center;z-index:100;flex-direction:column;padding:20px}
.overlay.hidden{display:none}.overlay-card{background:linear-gradient(145deg,#1a1a1a,#0a0a0a);border-radius:20px;padding:28px 24px;max-width:400px;width:100%;text-align:center;border:2px solid #444;box-shadow:0 8px 32px rgba(0,0,0,0.8)}
.overlay-card h2{font-size:21px;color:#FFEB3B;margin-bottom:8px}.overlay-card .subtitle{font-size:13px;color:#aaa;margin-bottom:12px;line-height:1.7}
.overlay-icon{font-size:52px;margin-bottom:8px;display:block}
.btn-go{background:linear-gradient(180deg,#66BB6A,#388E3C);color:#fff;border:none;padding:14px 40px;font-size:18px;font-weight:700;border-radius:30px;cursor:pointer;margin-top:12px;box-shadow:0 3px 10px rgba(76,175,80,0.4);transition:all 0.15s}
.btn-go:hover{transform:scale(1.05);box-shadow:0 5px 16px rgba(76,175,80,0.55)}.btn-go:active{transform:scale(0.95)}
.btn-secondary{background:linear-gradient(180deg,#7B1FA2,#4A148C);color:#fff;border:none;padding:12px 32px;font-size:16px;font-weight:700;border-radius:30px;cursor:pointer;margin-top:10px;box-shadow:0 3px 10px rgba(123,31,162,0.4);transition:all 0.15s}
.btn-secondary:hover{transform:scale(1.05);box-shadow:0 5px 16px rgba(123,31,162,0.55)}.btn-secondary:active{transform:scale(0.95)}
.diff-row{display:flex;gap:10px;margin:14px 0;justify-content:center}
.diff-btn{flex:1;padding:12px 8px;border-radius:12px;border:2px solid #555;background:rgba(255,255,255,0.08);color:#ccc;cursor:pointer;text-align:center;font-size:13px;font-weight:600;transition:all 0.2s;user-select:none}
.diff-btn.active{background:#4CAF50;color:#fff;border-color:#4CAF50;box-shadow:0 0 12px rgba(76,175,80,0.4)}.diff-btn:hover:not(.active){background:rgba(76,175,80,0.2);border-color:#4CAF50}
.result-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.result-stat{background:rgba(255,255,255,0.08);border-radius:10px;padding:8px;border:1px solid #444}.rs-label{font-size:11px;color:#aaa}.rs-value{font-size:18px;font-weight:800;color:#FFEB3B}
.tip{font-size:12px;color:#FF8A65;margin:8px 0;line-height:1.6}
.end-btns{display:flex;gap:12px;justify-content:center;margin-top:12px}

var DIFF={easy:{label:"简单",interval:2400,speed:0.3,gratingSpeed:0.3,gratingLambda:40},medium:{label:"中等",interval:1700,speed:0.6,gratingSpeed:0.5,gratingLambda:28},hard:{label:"困难",interval:1000,speed:1.0,gratingSpeed:0.8,gratingLambda:18}};
var diff="easy",cfg=DIFF.easy;
var score=0,lives=5,timeLeft=120,timerId=null,running=false,gameOver=false;
var canvas,ctx,w,h,animId,lastTs=0,gratingAngle=0;
var zombies=[],zombieTimer=null,zombieImg=null;
var flashPts=[],beams=[],soundOn=true,audioCtx=null;

(function init(){
  canvas=document.getElementById("gameCanvas");ctx=canvas.getContext("2d");
  resizeCanvas();window.addEventListener("resize",resizeCanvas);
  canvas.addEventListener("pointerdown",onCanvasClick);
  zombieImg=new Image();zombieImg.src=ZOMBIE_IMG;
  drawGratingStatic();
})();

function resizeCanvas(){
  var wrap=document.getElementById("gameWrap");
  canvas.width=wrap.clientWidth;canvas.height=wrap.clientHeight;
  w=canvas.width;h=canvas.height;
  if(!running)drawGratingStatic();
}

function selDiff(btn,d){diff=d;cfg=DIFF[d];document.querySelectorAll(".diff-btn").forEach(function(x){x.classList.toggle("active",x.dataset.d===d);});}

function startGame(){
  document.getElementById("startOverlay").classList.add("hidden");
  document.getElementById("endOverlay").classList.add("hidden");
  score=0;lives=5;timeLeft=120;running=true;gameOver=false;lastTs=0;gratingAngle=0;zombies=[];flashPts=[];
  cfg=DIFF[diff];initAudio();
  updateHUD();clearInterval(timerId);timerId=setInterval(tick,1000);
  spawnZombie();clearInterval(zombieTimer);
  zombieTimer=setInterval(spawnZombie,cfg.interval);
  requestAnimationFrame(gameLoop);
}

function tick(){timeLeft--;updateHUD();if(timeLeft<=0||lives<=0)endGame(false);}

function updateHUD(){document.getElementById("hudTime").textContent=timeLeft;}

function spawnZombie(){
  if(!running||gameOver)return;
  var margin=80,size=Math.max(70,Math.min(110,w/5));
  var x=margin+Math.random()*(w-margin*2);
  var y=margin+Math.random()*(h-margin*2);
  zombies.push({x:x,y:y,size:size,life:cfg.interval<1500?1:1,spawnTime:performance.now(),dirX:(Math.random()-0.5)*cfg.speed*60,dirY:(Math.random()-0.5)*cfg.speed*60});
}

function onCanvasClick(e){
  if(!running||gameOver)return;
  var rect=canvas.getBoundingClientRect();
  var cx=(e.clientX-rect.left)*(canvas.width/rect.width);
  var cy=(e.clientY-rect.top)*(canvas.height/rect.height);
  var hit=false;
  for(var i=zombies.length-1;i>=0;i--){
    var z=zombies[i],dx=cx-z.x,dy=cy-z.y;
    if(Math.sqrt(dx*dx+dy*dy)<z.size*0.7){hit=true;zombies.splice(i,1);score+=10;sndZap();flashPts.push({x:z.x,y:z.y,t:performance.now()});
      var bb=document.getElementById("blueberry"),bbr=bb.getBoundingClientRect(),wr2=document.getElementById("gameWrap").getBoundingClientRect();
      beams.push({sx:w/2,sy:h-5,tx:z.x,ty:z.y,t:performance.now(),dur:350});break;}
  }
  if(!hit){sndMiss();}
  updateHUD();
}

function gameLoop(ts){
  if(!running)return;
  if(!lastTs)lastTs=ts;
  var dt=(ts-lastTs)/1000;lastTs=ts;
  gratingAngle+=cfg.gratingSpeed*dt;
  for(var i=zombies.length-1;i>=0;i--){
    var z=zombies[i];z.x+=z.dirX*dt;z.y+=z.dirY*dt;
    var margin=z.size/2;
    if(z.x<margin||z.x>w-margin)z.dirX*=-1;
    if(z.y<margin||z.y>h-margin)z.dirY*=-1;
    if(performance.now()-z.spawnTime>8000){zombies.splice(i,1);lives--;if(lives<=0)endGame(false);sndBuzz();updateHUD();}
  }
  draw(ts);animId=requestAnimationFrame(gameLoop);
}

function draw(ts){
  ctx.clearRect(0,0,w,h);drawGrating();
  for(var i=zombies.length-1;i>=0;i--)drawZombie(zombies[i],ts);
  for(var i=flashPts.length-1;i>=0;i--){var f=flashPts[i];if(ts-f.t>200){flashPts.splice(i,1);continue;}drawFlashAt(f,ts);}
  for(var i=beams.length-1;i>=0;i--){var bm=beams[i];if(ts-bm.t>bm.dur){beams.splice(i,1);continue;}drawBeam(bm,ts);}
}

function drawGrating(){
  ctx.save();var radius=Math.min(w,h)/2;
  ctx.beginPath();ctx.arc(w/2,h/2,radius,0,Math.PI*2);ctx.clip();
  var lambda=cfg.gratingLambda,cover=radius*2.5,sw=cover,sh=cover;
  ctx.translate(w/2,h/2);ctx.rotate(gratingAngle);
  for(var x=-sw/2;x<sw/2;x+=1){
    var gray=Math.sin((x+sw/2)*Math.PI*2/lambda)*0.4+0.6;
    ctx.fillStyle="rgba("+Math.round(gray*255)+","+Math.round(gray*255)+","+Math.round(gray*255)+",1.0)";
    ctx.fillRect(x,-sh/2,1,sh);
  }ctx.restore();
}

function drawGratingStatic(){if(!w||!h)return;ctx.clearRect(0,0,w,h);drawGrating();}

function drawZombie(z,ts){
  if(!zombieImg||!zombieImg.complete)return;
  var pulse=1+Math.sin(performance.now()*0.005)*0.1;
  var s=z.size*pulse;
  ctx.save();ctx.shadowColor="#4FC3F7";ctx.shadowBlur=12;
  ctx.drawImage(zombieImg,z.x-s/2,z.y-s/2,s,s);ctx.restore();
}

function drawFlashAt(f,ts){
  var age=ts-f.t,alpha=1-age/200;
  ctx.save();ctx.fillStyle="rgba(255,235,59,"+alpha+")";ctx.font="bold 20px sans-serif";
  ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText("✦",f.x,f.y);ctx.restore();
}

function drawBeam(bm,ts){
  var age=ts-bm.t,progress=age/bm.dur,alpha=1-Math.abs(progress-0.5)*2;
  var cpX=(bm.sx+bm.tx)/2,cpY=Math.min(bm.sy,bm.ty)-40;
  var bx=bm.sx+(bm.tx-bm.sx)*progress,by=bm.sy+(bm.ty-bm.sy)*progress;
  by+=Math.sin(progress*Math.PI)*-30;
  ctx.save();
  // 外层粗蓝光晕
  ctx.lineWidth=12*alpha;ctx.strokeStyle="rgba(79,195,247,"+alpha*0.5+")";ctx.shadowColor="#4FC3F7";ctx.shadowBlur=20;
  ctx.beginPath();ctx.moveTo(bm.sx,bm.sy);ctx.quadraticCurveTo(cpX,cpY,bx,by);ctx.stroke();
  // 中层
  ctx.lineWidth=6*alpha;ctx.strokeStyle="rgba(79,195,247,"+alpha*0.8+")";ctx.shadowBlur=14;
  ctx.beginPath();ctx.moveTo(bm.sx,bm.sy);ctx.quadraticCurveTo(cpX,cpY,bx,by);ctx.stroke();
  // 内层白芯
  ctx.lineWidth=2.5*alpha;ctx.strokeStyle="rgba(255,255,255,"+alpha+")";ctx.shadowBlur=6;
  ctx.beginPath();ctx.moveTo(bm.sx,bm.sy);ctx.quadraticCurveTo(cpX,cpY,bx,by);ctx.stroke();
  // 终点电火花
  if(progress>0.6){var sa=(progress-0.6)/0.4;ctx.strokeStyle="rgba(255,235,59,"+sa+")";ctx.lineWidth=3;ctx.shadowBlur=10;
    ctx.beginPath();ctx.arc(bx,by,8,0,Math.PI*2);ctx.stroke();ctx.fillStyle="rgba(255,255,255,"+sa*0.7+")";ctx.fill();}
  ctx.restore();
}

function endGame(finished){
  running=false;gameOver=true;clearInterval(timerId);clearInterval(zombieTimer);cancelAnimationFrame(animId);
  var icon,rating;
  if(lives<=0){icon="💀";rating="游戏结束";}
  else if(finished||timeLeft<=0){icon="⭐";rating="时间到";}
  else{icon="🏆";rating="完成";}
  document.getElementById("endCard").innerHTML=
    '<span class="overlay-icon">'+icon+'</span><h2>'+rating+'</h2>'+
    '<div class="result-stats"><div class="result-stat"><div class="rs-label">得分</div><div class="rs-value">'+score+'</div></div>'+
    '<div class="result-stat"><div class="rs-label">剩余生命</div><div class="rs-value">'+Math.max(0,lives)+'</div></div>'+
    '<div class="result-stat"><div class="rs-label">难度</div><div class="rs-value">'+cfg.label+'</div></div>'+
    '<div class="result-stat"><div class="rs-label">消灭僵尸</div><div class="rs-value">'+Math.floor(score/10)+'</div></div></div>'+
    '<p class="tip">🔄‍⚕  请远眺5分钟，放松眼睛</p>'+
    '<div class="end-btns"><button class="btn-go" onclick="restartGame()">🔄 再玩一次</button><button class="btn-secondary" onclick="backToStart()">← 返回</button></div>';
  document.getElementById("endOverlay").classList.remove("hidden");
}

function restartGame(){document.getElementById("endOverlay").classList.add("hidden");startGame();}
function backToStart(){document.getElementById("endOverlay").classList.add("hidden");document.getElementById("startOverlay").classList.remove("hidden");}

function initAudio(){if(audioCtx)return;try{audioCtx=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}
function playTone(f,d,t,v){if(!audioCtx||!soundOn)return;t=t||"sine";v=v||0.08;try{var o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=t;o.frequency.setValueAtTime(f,audioCtx.currentTime);g.gain.setValueAtTime(v,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+d);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+d);}catch(e){}}
function sndZap(){playTone(800,0.05,"square",0.12);setTimeout(function(){playTone(1200,0.08,"sine",0.08)},30);setTimeout(function(){playTone(1600,0.06,"sine",0.06)},80);}
function sndMiss(){playTone(120,0.2,"sawtooth",0.06);}
function sndBuzz(){playTone(80,0.4,"sawtooth",0.08);}
function toggleSound(){soundOn=!soundOn;document.getElementById("hudSound").querySelector(".hud-icon").textContent=soundOn?"🔊":"🔇";if(soundOn)initAudio();}
</script><script>if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js')}</script>
