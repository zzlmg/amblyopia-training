<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>打苍蝇 · 弱视精细刺激训练</title>
<link rel="manifest" href="manifest.json">
<style>
:root {
  --bg: #FFF8E7;
  --surface: #FFF3D6;
  --accent: #FF6B35;
  --text: #5D4037;
  --muted: #A1887F;
  --card: #FFFFFF;
  --border: #E8D5B7;
}
* { margin:0; padding:0; box-sizing:border-box; }
html, body {
  height:100vh; width:100vw; overflow:hidden;
  display:flex; flex-direction:column;
  background:var(--bg);
  font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;
  user-select:none; -webkit-user-select:none;
  touch-action:manipulation;
}

/* Floating Top Bar */
.top-bar {
  position:absolute; top:0; left:0; right:0; height:38px;
  z-index:10;
  background:rgba(0,0,0,0.18); backdrop-filter:blur(6px);
  display:flex; align-items:center; justify-content:space-between;
  padding:0 12px;
}
.back-link {
  text-decoration:none; color:var(--accent); font-weight:600; font-size:14px;
  display:flex; align-items:center; gap:4px;
}
.back-link:hover { opacity:0.8; }
.top-bar-right { display:flex; align-items:center; gap:8px; }
.timer-ring { width:28px; height:28px; }
.sound-btn {
  background:none; border:none; color:#5D4037; font-size:16px;
  cursor:pointer; padding:2px 4px; line-height:1; opacity:0.85;
}
.sound-btn:hover { opacity:1; }

/* canvas wrapper */
.canvas-wrap {
  flex:1; width:100%; position:relative; overflow:hidden;
  cursor:crosshair;
  display:flex; align-items:center; justify-content:center;
}
canvas { display:block; max-width:100%; max-height:100%; }

/* Overlays */
.overlay {
  position:fixed; inset:0; z-index:200; padding:16px;
  background:rgba(0,0,0,0.45);
  display:flex; align-items:center; justify-content:center;
}
.overlay.hidden { display:none; }
.overlay-card {
  background:var(--card); border-radius:24px; padding:28px 24px;
  max-width:400px; width:100%; text-align:center;
  box-shadow:0 6px 30px rgba(0,0,0,0.1);
  border:2px solid var(--border);
}
.overlay-card h2 { font-size:1.35rem; color:var(--text); margin-bottom:6px; }
.overlay-card p  { font-size:0.85rem; color:var(--muted); line-height:1.7; margin:8px 0; }
.overlay-card .icon-big { font-size:3rem; display:block; margin-bottom:6px; }

.diff-select { display:flex; gap:6px; margin:14px 0; justify-content:center; flex-wrap:wrap; }
.diff-btn {
  padding:7px 16px; border-radius:22px; border:2px solid var(--border);
  background:transparent; color:var(--muted); font-size:0.88rem;
  font-weight:600; cursor:pointer; transition:all 0.18s;
}
.diff-btn:hover { border-color:var(--accent); color:var(--accent); }
.diff-btn.active { background:var(--accent); color:#fff; border-color:var(--accent); }

.btn-go {
  display:inline-block; padding:10px 32px; border-radius:26px;
  font-size:1rem; font-weight:700; cursor:pointer; border:none;
  background:linear-gradient(135deg,#FF6B35,#E64A19);
  color:#fff; margin-top:10px;
  box-shadow:0 4px 18px rgba(255,107,53,0.35);
  transition:transform 0.14s,box-shadow 0.14s;
}
.btn-go:hover { transform:scale(1.04); box-shadow:0 6px 24px rgba(255,107,53,0.5); }
.btn-go:active { transform:scale(0.96); }

/* Toast */
.toast {
  position:fixed; top:52px; right:16px;
  font-size:0.95rem; font-weight:700; color:var(--text);
  pointer-events:none; z-index:300; opacity:0;
  transition:opacity 0.12s;
  background:rgba(255,255,255,0.7); padding:4px 12px;
  border-radius:16px;
}
.toast.show { opacity:1; }

@media (max-width:500px) {
  .overlay-card { padding:18px 14px; }
  .overlay-card h2 { font-size:1.05rem; }
  .overlay-card p { font-size:0.78rem; }
}
</style>
</head>
<body>

<!-- Floating Top Bar -->
<div class="top-bar">
  <a href="index.html#games" class="back-link">&#8592; 返回游戏</a>
  <div class="top-bar-right">
    <canvas id="timerRing" width="28" height="28" class="timer-ring"></canvas>
    <button class="sound-btn" id="soundToggle" title="音效">&#128264;</button><a href="contact.html" style="font-size:15px;text-decoration:none;margin-left:6px;color:var(--blue)" title="联系我们">📬</a>
  </div>
</div>

<div class="canvas-wrap" id="canvasWrap">
  <canvas id="gameCanvas"></canvas>

  <div class="overlay" id="startOverlay">
    <div class="overlay-card">
      <span class="icon-big">&#129439;</span>
      <h2>消灭小苍蝇！</h2>
      <p>快速点击飞过的<b>小苍蝇</b>来得分<br>让它们飞走就太可惜啦！<br>手眼协调 + 快速反应训练 &#127919;</p>
      <div class="diff-select" id="diffSelect">
        <button class="diff-btn active" data-diff="easy">&#11088; 简单</button>
        <button class="diff-btn" data-diff="medium">&#11088;&#11088; 中等</button>

      <button class="btn-go" id="btnStart">开始训练</button>
    </div>

  <div class="overlay hidden" id="coverOverlay">
    <div class="overlay-card">
      <span class="icon-big">&#129657;</span>
      <h2>遮盖提醒</h2>
      <p>请<b>遮盖健眼（好眼）</b>，<br>仅用<b>弱视眼</b>进行训练。</p>

  <div class="overlay hidden" id="endOverlay">

  <div class="overlay hidden" id="pauseOverlay">
    <div class="overlay-card">
      <span style="font-size:3rem;display:block;">&#9208;</span>
      <h2>已暂停</h2>
      <button class="btn-go" id="btnResume">继续训练</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   打苍蝇 - 精细刺激 + 手眼协调训练游戏
   Canvas 960x540 base, responsive scaling
   临床依据：精细刺激训练通过高精度视觉任务
   刺激视网膜和视皮层发育，提升弱视眼视力
   ============================================================ */
/* localStorage 进度系统 */
const PROGRESS_KEY='amblyopia_progress';
function initProgress(){let r=localStorage.getItem(PROGRESS_KEY);if(!r){const p={version:1,totalPoints:0,streak:{current:0,best:0,lastDate:''},games:{'whack-a-mole':{plays:0,bestScore:0,totalHits:0,totalMisses:0,bestCombo:0},'spot-difference':{plays:0,bestScore:0,totalCorrect:0,totalWrong:0},'matching-game':{plays:0,bestScore:0,totalPairs:0,bestCombo:0},'maze-game':{plays:0,bestScore:0,totalMazes:0,fastestTime:null},'chase-the-light':{plays:0,bestScore:0,totalCaptures:0,bestCombo:0},'fly-swatter':{plays:0,bestScore:0,totalKills:0,totalEscapes:0}},calendar:{},achievements:[],settings:{difficulties:{}}};localStorage.setItem(PROGRESS_KEY,JSON.stringify(p));return p;}try{return JSON.parse(r);}catch(e){return null;}}
function getToday(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
const ACH=[{id:'first_game',check(p){return p.totalPoints>0;}},{id:'five_games',check(p){return Object.values(p.games).filter(g=>g.plays>0).length>=6;}},{id:'high_score_200',check(p){return Object.values(p.games).some(g=>g.bestScore>=200);}},{id:'streak_3',check(p){return p.streak.best>=3;}},{id:'streak_7',check(p){return p.streak.best>=7;}},{id:'total_1000',check(p){return p.totalPoints>=1000;}},{id:'no_escape',check(p){const g=p.games['fly-swatter'];return g.plays>0&&g.totalEscapes===0;}},{id:'ten_plays',check(p){return Object.values(p.games).reduce((s,g)=>s+g.plays,0)>=10;}},{id:'perfect_whack',check(p){const g=p.games['whack-a-mole'];return g.totalHits>=10&&g.totalHits/(g.totalHits+g.totalMisses)>=0.9;}}];
function saveGameResult(gameId,data){let p=initProgress();if(!p)return;const g=p.games[gameId];g.plays++;if(data.score>g.bestScore)g.bestScore=data.score;if(data.hits!==undefined)g.totalHits=(g.totalHits||0)+data.hits;if(data.misses!==undefined)g.totalMisses=(g.totalMisses||0)+data.misses;if(data.combo!==undefined&&data.combo>(g.bestCombo||0))g.bestCombo=data.combo;if(data.correct!==undefined)g.totalCorrect=(g.totalCorrect||0)+data.correct;if(data.wrong!==undefined)g.totalWrong=(g.totalWrong||0)+data.wrong;if(data.pairs!==undefined)g.totalPairs=(g.totalPairs||0)+data.pairs;if(data.mazes!==undefined)g.totalMazes=(g.totalMazes||0)+data.mazes;if(data.time!==undefined&&(g.fastestTime===null||data.time<g.fastestTime))g.fastestTime=data.time;if(data.captures!==undefined)g.totalCaptures=(g.totalCaptures||0)+data.captures;if(data.kills!==undefined)g.totalKills=(g.totalKills||0)+data.kills;if(data.escapes!==undefined)g.totalEscapes=(g.totalEscapes||0)+data.escapes;p.totalPoints+=data.score;const today=getToday();if(!p.calendar[today])p.calendar[today]={points:0,gamesPlayed:0,duration:0};p.calendar[today].points+=data.score;p.calendar[today].gamesPlayed++;p.calendar[today].duration+=data.duration||120;updateStreak(p,today);checkAch(p);if(data.difficulty)p.settings.difficulties[gameId]=data.difficulty;localStorage.setItem(PROGRESS_KEY,JSON.stringify(p));}
function updateStreak(p,today){if(!p.streak.lastDate){p.streak.current=1;p.streak.lastDate=today;}else{const last=new Date(p.streak.lastDate),curr=new Date(today);const diff=Math.floor((curr-last)/86400000);if(diff===1)p.streak.current++;else if(diff>1)p.streak.current=1;p.streak.lastDate=today;}if(p.streak.current>p.streak.best)p.streak.best=p.streak.current;}
function checkAch(p){const unlocked=new Set(p.achievements.map(a=>a.id));for(const ach of ACH){if(!unlocked.has(ach.id)&&ach.check(p)){p.achievements.push({id:ach.id,unlockedAt:getToday()});}}}

const canvas  = document.getElementById('gameCanvas');
const ctx     = canvas.getContext('2d');
const wrap    = document.getElementById('canvasWrap');
const timerCanvas = document.getElementById('timerRing');
const timerCtx    = timerCanvas.getContext('2d');

/* Constants */
const BASE_W = 960, BASE_H = 540;
let scale = 1, offsetX = 0, offsetY = 0;

const TOTAL_TIME = 120;
const MAX_FAILS  = 3;

/* Difficulty */
const DIFFICULTY = {
  easy: {
    label:'简单', sizeMin:48, sizeMax:56, speedMin:80, speedMax:120,
    intervalMin:1500, intervalMax:2500, maxFlies:2,
    flightType:'straight', warning:true, contrastOverlay:false
  },
  medium: {
    label:'中等', sizeMin:32, sizeMax:40, speedMin:140, speedMax:200,
    intervalMin:1000, intervalMax:1800, maxFlies:3,
    flightType:'sine', warning:false, contrastOverlay:false
  },
  hard: {
    label:'困难', sizeMin:20, sizeMax:28, speedMin:220, speedMax:300,
    intervalMin:600, intervalMax:1200, maxFlies:5,
    flightType:'zigzag', warning:false, contrastOverlay:true
  }
};
let diff = 'easy';
let cfg  = DIFFICULTY[diff];

/* CAM Background Stimulation State */
let stimType = 0;
let stimCycleStart = 0;
const STIM_CYCLE = 30000;

/* State */
let score=0, kills=0, escapes=0, timeLeft=TOTAL_TIME;
let running=false, paused=false;
let flies=[], particles=[], splats=[];
let spawnTimer=null, timerInterval=null;
let animId=null, lastTime=0;

/* Sound toggle */
let soundEnabled = true;
document.getElementById('soundToggle').addEventListener('click', function(){
  soundEnabled = !soundEnabled;
  this.textContent = soundEnabled ? '\uD83D\uDD0A' : '\uD83D\uDD07';
});

/* Audio: programmatic "啪" sound */
function playSwat() {
  if (!soundEnabled) return;
  try {
    const ac = new (window.AudioContext||window.webkitAudioContext)();
    const now = ac.currentTime;
    const buf = ac.createBuffer(1, ac.sampleRate*0.15, ac.sampleRate);
    const data = buf.getChannelData(0);
    for (let i=0; i<data.length; i++) {
      const t = i/ac.sampleRate;
      const env = Math.exp(-t*30);
      data[i] = (Math.random()*2-1)*env*0.7 + Math.sin(t*800)*env*0.3;
    }
    const src = ac.createBufferSource();
    src.buffer = buf;
    const gain = ac.createGain();
    gain.gain.setValueAtTime(0.6, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now+0.15);
    src.connect(gain).connect(ac.destination);
    src.start(now);
    setTimeout(()=>ac.close(), 200);
  } catch(e){}
}

function playFail() {
  if (!soundEnabled) return;
  try {
    const ac = new (window.AudioContext||window.webkitAudioContext)();
    const osc = ac.createOscillator();
    const gain = ac.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(200, ac.currentTime);
    osc.frequency.exponentialRampToValueAtTime(80, ac.currentTime+0.3);
    gain.gain.setValueAtTime(0.25, ac.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime+0.3);
    osc.connect(gain).connect(ac.destination);
    osc.start(); osc.stop(ac.currentTime+0.3);
    setTimeout(()=>ac.close(), 400);
  } catch(e){}
}

function playVictory() {
  if (!soundEnabled) return;
  try {
    const ac = new (window.AudioContext||window.webkitAudioContext)();
    const now = ac.currentTime;
    const melody = [
      {f:523.25,d:0.10},{f:659.25,d:0.10},{f:783.99,d:0.10},
      {f:880,d:0.10},{f:1046.5,d:0.18},
    ];
    melody.forEach((n,i)=>{
      const o=ac.createOscillator(),g=ac.createGain();
      o.type='square';o.frequency.value=n.f;
      const t=now+i*0.1;
      g.gain.setValueAtTime(0.12,t);
      g.gain.exponentialRampToValueAtTime(0.001,t+n.d);
      o.connect(g).connect(ac.destination);
      o.start(t);o.stop(t+n.d);
    });
    const harm=[659.25,783.99,1046.5,1318.5];
    harm.forEach((f,i)=>{
      const o=ac.createOscillator(),g=ac.createGain();
      o.type='triangle';o.frequency.value=f;
      const t=now+0.55+i*0.09;
      g.gain.setValueAtTime(0.08,t);
      g.gain.exponentialRampToValueAtTime(0.001,t+0.3);
      o.connect(g).connect(ac.destination);
      o.start(t);o.stop(t+0.3);
    });
    const chord=[523.25,659.25,783.99,1046.5,1318.5];
    chord.forEach(f=>{
      const o=ac.createOscillator(),g=ac.createGain();
      o.type='sine';o.frequency.value=f;
      const t=now+0.9;
      g.gain.setValueAtTime(0.06,t);
      g.gain.exponentialRampToValueAtTime(0.001,t+0.55);
      o.connect(g).connect(ac.destination);
      o.start(t);o.stop(t+0.55);
    });
    for(let i=0;i<10;i++){
      const o=ac.createOscillator(),g=ac.createGain();
      o.type='sine';
      o.frequency.value=1400+Math.random()*900;
      const t=now+1.0+i*0.06;
      g.gain.setValueAtTime(0.05,t);
      g.gain.exponentialRampToValueAtTime(0.001,t+0.15);
      o.connect(g).connect(ac.destination);
      o.start(t);o.stop(t+0.15);
    }
    setTimeout(()=>ac.close(),1800);
  } catch(e) {}
}

/* Toast */
const toast=document.getElementById('toast');
let toastT=null;
function showToast(msg,d=600){toast.textContent=msg;toast.classList.add('show');
  clearTimeout(toastT);toastT=setTimeout(()=>toast.classList.remove('show'),d);}

/* Timer ring (small, in top bar) */
function drawTimerRing(){
  const tw=28,th=28,cx=14,cy=14,r=11;
  timerCanvas.width=tw;timerCanvas.height=th;
  timerCtx.clearRect(0,0,tw,th);
  timerCtx.beginPath();timerCtx.arc(cx,cy,r,0,Math.PI*2);
  timerCtx.strokeStyle='rgba(93,64,55,0.15)';timerCtx.lineWidth=2;timerCtx.stroke();
  const pct=timeLeft/TOTAL_TIME;
  timerCtx.beginPath();timerCtx.arc(cx,cy,r,-Math.PI/2,-Math.PI/2+Math.PI*2*pct);
  timerCtx.strokeStyle=pct>0.3?'#FF6B35':'#EF5350';timerCtx.lineWidth=2;timerCtx.lineCap='round';
  timerCtx.stroke();
  timerCtx.fillStyle='#5D4037';timerCtx.font='bold 8px -apple-system,sans-serif';
  timerCtx.textAlign='center';timerCtx.textBaseline='middle';
  timerCtx.fillText(Math.ceil(timeLeft)+'s',cx,cy);
}

/* Scaling */
function resizeCanvas() {
  const rect = wrap.getBoundingClientRect();
  const availW = rect.width - 16;
  const availH = rect.height - 16;
  const ratio = BASE_W / BASE_H;
  let w,h;
  if (availW/availH > ratio) {
    h = availH; w = h * ratio;
  } else {
    w = availW; h = w / ratio;
  }
  scale = w/BASE_W;
  offsetX = (availW-w)/2+8;
  offsetY = (availH-h)/2+8;
  canvas.width  = w * window.devicePixelRatio;
  canvas.height = h * window.devicePixelRatio;
  canvas.style.width  = w+'px';
  canvas.style.height = h+'px';
  ctx.setTransform(1,0,0,1,0,0);
  ctx.scale(window.devicePixelRatio*scale, window.devicePixelRatio*scale);
}
window.addEventListener('resize',resizeCanvas);

/* Fly class */
class Fly {
  constructor() {
    this.reset();
  }
  reset() {
    this.size  = cfg.sizeMin + Math.random()*(cfg.sizeMax-cfg.sizeMin);
    this.x     = -this.size - 10;
    this.y     = this.size*1.2 + Math.random()*(BASE_H-this.size*2.4);
    this.speed = cfg.speedMin + Math.random()*(cfg.speedMax-cfg.speedMin);
    if (cfg.flightType==='zigzag' && Math.random()>0.5) {
      this.speed *= (0.7 + Math.random()*0.6);
    }
    this.alive    = true;
    this.hitAnim  = 0;
    this.wingPhase = Math.random()*Math.PI*2;
    this.warningAnim = cfg.warning ? 0.3 : 0;
    this.sineAmp  = cfg.flightType==='sine' ? 15+Math.random()*20 : 0;
    this.sineFreq = 0.003+Math.random()*0.005;
    this.baseY    = this.y;
    this.zigPoints= [];
    if (cfg.flightType==='zigzag') {
      const n = 2+Math.floor(Math.random()*3);
      for (let i=0; i<n; i++) {
        this.zigPoints.push({
          x: BASE_W*(0.2 + i*(0.7/(n-1)) + Math.random()*0.1),
          y: this.size*1.5 + Math.random()*(BASE_H-this.size*3)
        });
      }
      this.zigIdx = 0;
      if (this.zigPoints.length>0) this.targetX=this.zigPoints[0].x;
    }
    if (cfg.warning) this.warningAlpha=1;
  }
  update(dtSec) {
    if (!this.alive) {
      this.hitAnim += dtSec;
      return;
    }
    this.wingPhase += dtSec*18;
    if (this.warningAnim>0) { this.warningAnim-=dtSec; return; }
    this.x += this.speed*dtSec;
    if (cfg.flightType==='sine' && this.sineAmp>0) {
      this.y = this.baseY + Math.sin(this.x*this.sineFreq)*this.sineAmp;
    } else if (cfg.flightType==='zigzag' && this.zigPoints.length>0) {
      if (this.zigIdx < this.zigPoints.length) {
        const tp = this.zigPoints[this.zigIdx];
        const dx=tp.x-this.x, dy=tp.y-this.y;
        const dist=Math.sqrt(dx*dx+dy*dy);
        if (dist<8) { this.zigIdx++; }
        else {
          const spd = this.speed*(0.8+Math.random()*0.4);
          this.x += (dx/dist)*spd*dtSec*0.7;
          this.y += (dy/dist)*spd*dtSec*0.7;
        }
      }
    }
  }
  draw(ctx) {
    if (!this.alive) {
      if (this.hitAnim>0.5) return true;
      drawSplat(ctx, this.x, this.y, this.size, this.hitAnim);
      return this.hitAnim>0.5;
    }
    if (this.warningAnim>0) {
      const alpha=this.warningAnim/0.3;
      ctx.beginPath();ctx.arc(this.x,this.y,this.size*1.1,0,Math.PI*2);
      ctx.strokeStyle=`rgba(255,215,0,${alpha*0.8})`;
      ctx.lineWidth=3;ctx.setLineDash([4,4]);
      ctx.stroke();ctx.setLineDash([]);
      return false;
    }
    const s=this.size, x=this.x, y=this.y;
    const wingFlap=Math.sin(this.wingPhase);
    ctx.save();
    ctx.translate(x,y);
    ctx.beginPath();ctx.ellipse(0,s*0.45,s*0.12,s*0.05,0,0,Math.PI*2);
    ctx.fillStyle='rgba(0,0,0,0.08)';ctx.fill();
    ctx.strokeStyle='#3E2723';ctx.lineWidth=s*0.05;ctx.lineCap='round';
    // 医学修正: 困难档(小苍蝇)省略腿/触角细节，避免视觉噪声
    if (s >= 30) {
      for (let i=-1;i<=1;i++){
        ctx.beginPath();ctx.moveTo(i*s*0.15,s*0.25);
        ctx.lineTo(i*s*0.25,s*0.45);ctx.stroke();
      }
      for (let i=-1;i<=1;i++){
        ctx.beginPath();ctx.moveTo(i*s*0.15,s*0.05);
        ctx.lineTo(i*s*0.3,-s*0.2-Math.abs(i)*s*0.08);ctx.stroke();
      }
    }
    ctx.save();
    const wTilt=wingFlap*0.3;
    ctx.rotate(-0.3+wTilt);
    ctx.beginPath();ctx.ellipse(s*0.08,-s*0.35,s*0.45,s*0.2,0.2,0,Math.PI*2);
    ctx.fillStyle='rgba(240,245,255,0.85)';ctx.fill();
    ctx.strokeStyle='rgba(180,200,230,0.6)';ctx.lineWidth=0.8;ctx.stroke();
    ctx.strokeStyle='rgba(180,200,230,0.4)';ctx.lineWidth=0.4;
    ctx.beginPath();ctx.moveTo(s*0.08,-s*0.35);ctx.lineTo(s*0.4,-s*0.25);ctx.stroke();
    ctx.beginPath();ctx.moveTo(s*0.08,-s*0.35);ctx.lineTo(-s*0.2,-s*0.3);ctx.stroke();
    ctx.rotate(0.6-wTilt);
    ctx.beginPath();ctx.ellipse(s*0.08,-s*0.35,s*0.45,s*0.2,0.2,0,Math.PI*2);
    ctx.fillStyle='rgba(240,245,255,0.75)';ctx.fill();
    ctx.strokeStyle='rgba(180,200,230,0.5)';ctx.lineWidth=0.8;ctx.stroke();
    ctx.restore();
    const bodyGrad=ctx.createLinearGradient(0,-s*0.2,0,s*0.3);
    bodyGrad.addColorStop(0,'#FDD835');
    bodyGrad.addColorStop(0.4,'#FBC02D');
    bodyGrad.addColorStop(0.7,'#F9A825');
    bodyGrad.addColorStop(1,'#F57F17');
    ctx.beginPath();ctx.ellipse(0,s*0.08,s*0.2,s*0.3,0,0,Math.PI*2);
    ctx.fillStyle=bodyGrad;ctx.fill();
    ctx.strokeStyle='rgba(62,39,35,0.35)';ctx.lineWidth=s*0.045;
    for (let i=-1;i<=1;i++){
      ctx.beginPath();ctx.moveTo(-s*0.18,i*s*0.06);ctx.lineTo(s*0.18,i*s*0.06);ctx.stroke();
    }
    const headGrad=ctx.createRadialGradient(0,-s*0.22,0,0,-s*0.22,s*0.18);
    headGrad.addColorStop(0,'#FFF176');
    headGrad.addColorStop(1,'#F9A825');
    ctx.beginPath();ctx.arc(0,-s*0.22,s*0.18,0,Math.PI*2);
    ctx.fillStyle=headGrad;ctx.fill();
    const eyeR=s*0.09;
    ctx.beginPath();ctx.arc(-s*0.09,-s*0.25,eyeR,0,Math.PI*2);
    ctx.fillStyle='#FFFFFF';ctx.fill();
    ctx.beginPath();ctx.arc(-s*0.09,-s*0.25,eyeR,0,Math.PI*2);
    ctx.strokeStyle='#3E2723';ctx.lineWidth=s*0.03;ctx.stroke();
    ctx.beginPath();ctx.arc(s*0.09,-s*0.25,eyeR,0,Math.PI*2);
    ctx.fillStyle='#FFFFFF';ctx.fill();
    ctx.beginPath();ctx.arc(s*0.09,-s*0.25,eyeR,0,Math.PI*2);
    ctx.strokeStyle='#3E2723';ctx.lineWidth=s*0.03;ctx.stroke();
    ctx.beginPath();ctx.arc(-s*0.07,-s*0.24,eyeR*0.45,0,Math.PI*2);
    ctx.fillStyle='#1a1a1a';ctx.fill();
    ctx.beginPath();ctx.arc(s*0.11,-s*0.24,eyeR*0.45,0,Math.PI*2);
    ctx.fillStyle='#1a1a1a';ctx.fill();
    ctx.beginPath();ctx.arc(-s*0.1,-s*0.27,eyeR*0.22,0,Math.PI*2);
    ctx.fillStyle='rgba(255,255,255,0.8)';ctx.fill();
    ctx.beginPath();ctx.arc(s*0.08,-s*0.27,eyeR*0.22,0,Math.PI*2);
    ctx.fillStyle='rgba(255,255,255,0.8)';ctx.fill();
    ctx.beginPath();ctx.arc(0,-s*0.18,s*0.06,0.2,Math.PI-0.2);
    ctx.strokeStyle='#3E2723';ctx.lineWidth=s*0.03;ctx.stroke();
    ctx.strokeStyle='#5D4037';ctx.lineWidth=s*0.03;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(-s*0.05,-s*0.38);
    ctx.quadraticCurveTo(-s*0.15,-s*0.5,-s*0.2,-s*0.48);
    ctx.stroke();
    ctx.beginPath();ctx.moveTo(s*0.05,-s*0.38);
    ctx.quadraticCurveTo(s*0.15,-s*0.5,s*0.2,-s*0.48);
    ctx.stroke();
    ctx.beginPath();ctx.arc(-s*0.2,-s*0.48,s*0.03,0,Math.PI*2);
    ctx.fillStyle='#5D4037';ctx.fill();
    ctx.beginPath();ctx.arc(s*0.2,-s*0.48,s*0.03,0,Math.PI*2);
    ctx.fill();
    ctx.restore();
    return false;
  }

  hit() {
    if (!this.alive) return false;
    this.alive=false; this.hitAnim=0;
    spawnParticles(this.x, this.y, this.size);
    spawnSplat(this.x, this.y, this.size);
    return true;
  }

  isOffscreen() { return this.x > BASE_W+this.size+20; }

  contains(px,py) {
    if (!this.alive || this.warningAnim>0) return false;
    const dx=px-this.x, dy=py-this.y;
    return Math.sqrt(dx*dx+dy*dy) < this.size*0.7;
  }
}

/* Splat */
function spawnSplat(x,y,s){ splats.push({x,y,life:0.5,r:s*0.8}); }
function drawSplat(ctx,x,y,s,age){
  const alpha=1-(age/0.5);
  ctx.save();ctx.translate(x,y);
  ctx.beginPath();ctx.ellipse(0,0,s*0.7*(1+age),s*0.3*(1+age),0.1,0,Math.PI*2);
  ctx.fillStyle=`rgba(255,200,50,${alpha*0.35})`;ctx.fill();
  for (let i=0;i<6;i++){
    const a=(Math.PI*2*i)/6+age;
    const len=s*0.4*(1+age);
    ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(Math.cos(a)*len,Math.sin(a)*len);
    ctx.strokeStyle=`rgba(139,90,43,${alpha*0.5})`;ctx.lineWidth=2;ctx.stroke();
  }
  ctx.restore();
}

/* Particles */
function spawnParticles(x,y,s){
  for (let i=0;i<14;i++){
    const angle=Math.random()*Math.PI*2;
    const speed=60+Math.random()*180;
    particles.push({
      x,y,
      vx:Math.cos(angle)*speed,
      vy:Math.sin(angle)*speed,
      life:0.5+Math.random()*0.3,
      r:2+Math.random()*(s*0.12),
      color:['#FFD54F','#FFAB40','#8D6E63','#5D4037'][Math.floor(Math.random()*4)]
    });
  }
}

/* Spawn fly */
function trySpawnFly() {
  const aliveCount = flies.filter(f=>f.alive).length;
  if (aliveCount >= cfg.maxFlies) return;
  flies.push(new Fly());
}

/* Update */
function update(dtSec) {
  for (let i=flies.length-1;i>=0;i--) {
    const f=flies[i];
    f.update(dtSec);
    if (f.alive && f.isOffscreen()) {
      f.alive=false; f.hitAnim=999;
      escapes++;
      playFail();
      updateHUD();
      showToast('\u274C 飞走了！',500);
      if (escapes>=MAX_FAILS) {
        endGame();
        return;
      }
    }
  }
  for (let i=splats.length-1;i>=0;i--) {
    splats[i].life-=dtSec; if(splats[i].life<=0)splats.splice(i,1);
  }
  for (let i=particles.length-1;i>=0;i--) {
    const p=particles[i];
    p.x+=p.vx*dtSec; p.y+=p.vy*dtSec;
    p.life-=dtSec; if(p.life<=0)particles.splice(i,1);
  }
  for (let i=flies.length-1;i>=0;i--) {
    const f=flies[i];
    if (!f.alive && f.hitAnim>0.5) flies.splice(i,1);
  }
}

/* CAM Background Stimulation Patterns */

const CAM_CX = BASE_W / 2;
const CAM_CY = BASE_H / 2;
const CAM_RPM = 1.0;
const CAM_OPACITY = 0.80;
const CAM_SAFE_R = Math.ceil(Math.sqrt(BASE_W*BASE_W + BASE_H*BASE_H) / 2) + 4;

function drawStimCheckerboard(ctx, elapsed) {
  const sq = 20;
  const angle = (elapsed / 60000) * Math.PI * 2 * CAM_RPM;
  const cover = CAM_SAFE_R * 2;
  ctx.save();
  ctx.globalAlpha = CAM_OPACITY + 0.02;
  ctx.translate(CAM_CX, CAM_CY);
  ctx.rotate(angle);
  ctx.translate(-CAM_CX, -CAM_CY);
  const sx = CAM_CX - cover;
  const sy = CAM_CY - cover;
  const cols = Math.ceil(cover * 2 / sq);
  const rows = Math.ceil(cover * 2 / sq);
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      if ((r + c) % 2 === 0) {
        ctx.fillStyle = '#1a1a1a';
        ctx.fillRect(sx + c * sq, sy + r * sq, sq, sq);
      }
    }
  }
  ctx.restore();
}

function drawStimBWGrating(ctx, elapsed) {
  const barW = 14;
  const angle = (elapsed / 50000) * Math.PI * 2 * CAM_RPM;
  const cover = CAM_SAFE_R;
  ctx.save();
  ctx.globalAlpha = CAM_OPACITY;
  ctx.translate(CAM_CX, CAM_CY);
  ctx.rotate(angle);
  ctx.translate(-CAM_CX, -CAM_CY);
  const totalBars = Math.ceil(cover * 2 / barW);
  for (let i = -totalBars; i < totalBars; i++) {
    const x = CAM_CX + i * barW;
    ctx.fillStyle = (i % 2 === 0) ? '#111' : 'transparent';
    ctx.fillRect(x, CAM_CY - cover * 2, barW, cover * 4);
  }
  ctx.restore();
}

function drawStimRBGrating(ctx, elapsed) {
  const barW = 14;
  const angle = (elapsed / 48000) * Math.PI * 2 * CAM_RPM;
  const cover = CAM_SAFE_R;
  ctx.save();
  ctx.globalAlpha = CAM_OPACITY;
  ctx.translate(CAM_CX, CAM_CY);
  ctx.rotate(angle);
  ctx.translate(-CAM_CX, -CAM_CY);
  const totalBars = Math.ceil(cover * 2 / barW);
  for (let i = -totalBars; i < totalBars; i++) {
    const x = CAM_CX + i * barW;
    if (i % 2 === 0) {
      ctx.fillStyle = '#D32F2F';
      ctx.fillRect(x, CAM_CY - cover * 2, barW, cover * 4);
    } else {
      ctx.fillStyle = '#1565C0';
      ctx.fillRect(x, CAM_CY - cover * 2, barW, cover * 4);
    }
  }
  ctx.restore();
}

function drawStimulationBackground(ctx, elapsed) {
  if (!running || paused) return;
  switch (stimType) {
    case 0: drawStimCheckerboard(ctx, elapsed); break;
    case 1: drawStimBWGrating(ctx, elapsed); break;
    case 2: drawStimRBGrating(ctx, elapsed); break;
  }
}

function drawStimLabel(ctx, elapsed) {
  if (!running || paused) return;
  const labels = ['\u25C8 黑白棋盘格', '\u25A5 黑白方波条栅', '\uD83D\uDD34\uD83D\uDD35 红蓝条栅'];
  const text = labels[stimType] + ' \u00B7 旋转';
  const remain = Math.ceil((STIM_CYCLE - (elapsed % STIM_CYCLE)) / 1000);
  ctx.save();
  ctx.font = '11px -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif';
  const tw = ctx.measureText(text).width + 14;
  const tx = BASE_W - tw - 16, ty = 14, th = 22, r = 11;
  ctx.fillStyle = 'rgba(255,248,231,0.85)';
  ctx.beginPath();
  ctx.moveTo(tx + r, ty);
  ctx.lineTo(tx + tw - r, ty);
  ctx.arcTo(tx + tw, ty, tx + tw, ty + r, r);
  ctx.lineTo(tx + tw, ty + th - r);
  ctx.arcTo(tx + tw, ty + th, tx + tw - r, ty + th, r);
  ctx.lineTo(tx + r, ty + th);
  ctx.arcTo(tx, ty + th, tx, ty + th - r, r);
  ctx.lineTo(tx, ty + r);
  ctx.arcTo(tx, ty, tx + r, ty, r);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = 'rgba(161,136,127,0.35)'; ctx.lineWidth = 0.8;
  ctx.stroke();
  ctx.fillStyle = '#8D6E63';
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillText(text, tx + 7, ty + 11);
  ctx.fillStyle = '#A1887F';
  ctx.font = '9px -apple-system, "PingFang SC", sans-serif';
  ctx.textAlign = 'right';
  ctx.fillText(remain + 's', tx + tw - 7, ty + 11);
  ctx.restore();
}

/* Draw */
function draw() {
  ctx.clearRect(0,0,BASE_W,BASE_H);
  ctx.fillStyle='#FFF8E7';ctx.fillRect(0,0,BASE_W,BASE_H);
  // 医学修正: 网格α从0.25→0.12，降低CAM背景上的纹理干扰
  ctx.strokeStyle='rgba(200,180,160,0.12)';ctx.lineWidth=0.5;
  for (let x=0;x<BASE_W;x+=30){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,BASE_H);ctx.stroke();}
  for (let y=0;y<BASE_H;y+=30){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(BASE_W,y);ctx.stroke();}
  if (cfg.contrastOverlay) {
    ctx.fillStyle='rgba(180,175,165,0.12)';ctx.fillRect(0,0,BASE_W,BASE_H);
  }
  const stimElapsed = running ? performance.now() - stimCycleStart : 0;
  if (running && stimElapsed >= STIM_CYCLE) {
    stimType = (stimType + 1) % 3;
    stimCycleStart = performance.now();
  }
  const stimCurrElapsed = running ? performance.now() - stimCycleStart : 0;
  drawStimulationBackground(ctx, stimCurrElapsed);
  for (const s of splats) drawSplat(ctx,s.x,s.y,s.r,s.life);
  for (const p of particles) {
    ctx.beginPath();ctx.arc(p.x,p.y,p.r*p.life*2,0,Math.PI*2);
    const alpha=Math.max(0,Math.min(1,p.life*0.8));
    if (p.color.startsWith('#')) {
      const r=parseInt(p.color.slice(1,3),16);
      const g=parseInt(p.color.slice(3,5),16);
      const b=parseInt(p.color.slice(5,7),16);
      ctx.fillStyle=`rgba(${r},${g},${b},${alpha})`;
    } else {
      ctx.fillStyle=p.color.replace(')',`,${alpha})`).replace('rgb(','rgba(');
    }
    ctx.fill();
  }
  for (const f of flies) f.draw(ctx);
  drawStimLabel(ctx, stimCurrElapsed);
  if (escapes>=2) {
    const pulse=0.3+0.3*Math.sin(Date.now()*0.004);
    const grad=ctx.createLinearGradient(BASE_W-40,0,BASE_W,0);
    grad.addColorStop(0,'rgba(255,171,64,0)');
    grad.addColorStop(0.5,`rgba(255,171,64,${pulse})`);
    grad.addColorStop(1,'rgba(255,171,64,0)');
    ctx.fillStyle=grad;ctx.fillRect(BASE_W-40,0,40,BASE_H);
  }
}

/* Handle click */
function handleClick(clientX, clientY) {
  if (!running || paused) return;
  const rect=canvas.getBoundingClientRect();
  const cx=(clientX-rect.left)/rect.width*BASE_W;
  const cy=(clientY-rect.top)/rect.height*BASE_H;
  if (cx<0||cx>BASE_W||cy<0||cy>BASE_H) return;
  let hit=false;
  for (let i=flies.length-1;i>=0;i--) {
    const f=flies[i];
    if (f.contains(cx,cy)) {
      if (f.hit()) {
        kills++; score+=10;
        playSwat();
        updateHUD();
        if (kills%5===0) showToast('\uD83D\uDD25 '+score+'\u5206\uFF01',600);
      }
      hit=true; break;
    }
  }
}

canvas.addEventListener('pointerdown', e=>{
  e.preventDefault();
  const rect=canvas.getBoundingClientRect();
  handleClick(e.clientX,e.clientY);
});
canvas.addEventListener('touchstart', e=>{
  e.preventDefault();
  for (const t of e.changedTouches) {
    handleClick(t.clientX,t.clientY);
  }
},{passive:false});

/* Game loop */
let lastFrameTime=0;
function gameLoop(ts) {
  if (!running) return;
  let dt = lastFrameTime ? (ts-lastFrameTime)/1000 : 0.016;
  if (dt>0.1) dt=0.1;
  lastFrameTime=ts;
  if (!paused) update(dt);
  draw();
  drawTimerRing();
  animId=requestAnimationFrame(gameLoop);
}

/* Spawn timer */
function startSpawnTimer() {
  spawnTimer=setInterval(()=>{
    if (!running||paused) return;
    trySpawnFly();
  }, cfg.intervalMin+100);
}

let nextSpawnAt=0;
function scheduleSpawn() {
  const interval=cfg.intervalMin+Math.random()*(cfg.intervalMax-cfg.intervalMin);
  nextSpawnAt = performance.now()+interval;
}

let spawnCheckId=null;
function spawnLoop(ts) {
  if (!running||paused){spawnCheckId=requestAnimationFrame(spawnLoop);return;}
  if (ts>=nextSpawnAt) {
    trySpawnFly();
    scheduleSpawn();
  }
  spawnCheckId=requestAnimationFrame(spawnLoop);
}

/* Timer */
function startTimer() {
  timerInterval=setInterval(()=>{
    if (!running||paused) return;
    timeLeft=Math.max(0,timeLeft-1);
    drawTimerRing();
    if (timeLeft<=0) endGame();
  },1000);
}

/* HUD (no-op, stats shown in end overlay) */
function updateHUD() {
  // Score/kills/escapes now only shown in end overlay
}

/* Start */
function startGame() {
  diff=document.querySelector('.diff-btn.active')?.dataset?.diff||'easy';
  cfg=DIFFICULTY[diff];
  score=0;kills=0;escapes=0;timeLeft=TOTAL_TIME;
  flies=[];particles=[];splats=[];
  updateHUD();drawTimerRing();
  resizeCanvas();
  stimCycleStart = performance.now();
  stimType = 0;
  document.getElementById('startOverlay').classList.add('hidden');
  document.getElementById('coverOverlay').classList.add('hidden');
  document.getElementById('endOverlay').classList.add('hidden');
  document.getElementById('pauseOverlay').classList.add('hidden');
  running=true;paused=false;
  lastFrameTime=0;lastTime=performance.now();
  animId=requestAnimationFrame(gameLoop);
  startTimer();
  scheduleSpawn();
  if (!spawnCheckId||spawnCheckId<=0) spawnCheckId=requestAnimationFrame(spawnLoop);
}

/* End */
function endGame() {
  running=false;
  if (animId) cancelAnimationFrame(animId);
  if (timerInterval) clearInterval(timerInterval);
  if (spawnTimer) clearInterval(spawnTimer);
  if (spawnCheckId) { cancelAnimationFrame(spawnCheckId); spawnCheckId=0; }
  const reason=escapes>=MAX_FAILS?'\uD83D\uDC1D 苍蝇逃走了3只！':timeLeft<=0?'\u23F0 时间到！':'';
  let grade=score>=200?'\uD83C\uDFC6 太厉害了！':score>=120?'\uD83C\uDF1F 非常优秀':score>=60?'\uD83D\uDC4D 不错哦':score>=20?'\uD83D\uDCAA 继续加油':'\uD83D\uDC23 慢慢来';
  if (escapes===0) grade='\uD83C\uDFAF 完美无逃脱！';
  if (escapes < MAX_FAILS) { playVictory(); }

  document.getElementById('endCard').innerHTML=`
    <span style="font-size:3rem;display:block;margin-bottom:6px;">${escapes>=MAX_FAILS?'\uD83D\uDC1D':'\uD83C\uDF89'}</span>
    <h2>${reason||'\u8BAD\u7EC3\u7ED3\u675F\uFF01'}</h2>
    <div style="margin:14px 0;line-height:2;font-size:0.92rem;color:var(--text);">
      <div>\uD83C\uDFAF 得分：<b style="color:#43A047">${score}</b></div>
      <div>\uD83D\uDCA5 击杀：<b style="color:#FF8F00">${kills} 只</b></div>
      <div>\u274C 逃脱：<b style="color:#EF5350">${escapes} 只</b></div>
      <div>\u23F1 时长：<b>2 分钟</b></div>
    </div>
    <div style="font-size:1.2rem;font-weight:700;color:var(--accent);margin:10px 0;">${grade}</div>
    <p style="font-size:0.78rem;color:var(--muted);">遮盖健眼休息5分钟后再继续</p>
    <button class="btn-go" onclick="startGame()">再来一局</button>
    <button style="display:block;margin:10px auto 0;padding:7px 18px;border-radius:20px;border:1.5px solid var(--border);background:transparent;color:var(--muted);font-size:0.82rem;cursor:pointer;" onclick="backToMenu()">返回主菜单</button>
  `;
  document.getElementById('endOverlay').classList.remove('hidden');
  saveGameResult('fly-swatter', {score, kills, escapes, difficulty:diff, duration:120});
}

function backToMenu(){
  document.getElementById('endOverlay').classList.add('hidden');
  document.getElementById('startOverlay').classList.remove('hidden');
  score=0;kills=0;escapes=0;timeLeft=TOTAL_TIME;flies=[];particles=[];splats=[];
  updateHUD();drawTimerRing();
}

/* Event listeners */
document.getElementById('btnStart').addEventListener('click',()=>{
  document.getElementById('startOverlay').classList.add('hidden');
  document.getElementById('coverOverlay').classList.remove('hidden');
});
document.getElementById('btnReady').addEventListener('click',startGame);
document.getElementById('btnResume').addEventListener('click',()=>{
  paused=false;
  document.getElementById('pauseOverlay').classList.add('hidden');
  lastFrameTime=0;
});

document.querySelectorAll('.diff-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.diff-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
  });
});

window.addEventListener('keydown',e=>{
  if (e.code==='Space' && running) {
    e.preventDefault();
    paused=!paused;
    if (paused) {
      document.getElementById('pauseOverlay').classList.remove('hidden');
    } else {
      document.getElementById('pauseOverlay').classList.add('hidden');
      lastFrameTime=0;
    }
  }
});

/* Init */
resizeCanvas();
drawTimerRing();
updateHUD();
</script>
