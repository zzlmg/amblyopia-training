<!DOCTYPE html><html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>舒尔特方格 · 太阳花弱视训练</title>
<link rel="manifest" href="manifest.json">
<style>
/* ===== Reset & Base ===== */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px;height:100%}
body{
  font-family:'PingFang SC','Microsoft YaHei','Helvetica Neue',sans-serif;
  background:#EDE7F6; color:#333;
  height:100vh; width:100vw; overflow:hidden;
  display:flex; flex-direction:column;
  -webkit-tap-highlight-color:transparent;
  user-select:none; -webkit-user-select:none;
}

/* ===== Top Bar ===== */
.top-bar{
  position:absolute; top:0; left:0; right:0; height:38px; z-index:10;
  background:rgba(92,107,192,0.25); backdrop-filter:blur(6px);
  display:flex; align-items:center; justify-content:space-between; padding:0 12px;
}
.back-link{
  text-decoration:none; color:#3F51B5; font-weight:600;
  font-size:14px; display:flex; align-items:center; gap:4px;
}
.back-link:hover{opacity:0.8}
.top-bar-right{
  display:flex; align-items:center; gap:10px;
}
.timer-display{
  font-size:14px; font-weight:700; color:#3F51B5;
  background:rgba(255,255,255,0.7); border-radius:10px;
  padding:3px 10px; min-width:50px; text-align:center;
}
.sound-btn{
  cursor:pointer; font-size:16px; padding:2px 4px;
  border-radius:6px; background:rgba(255,255,255,0.5);
  width:28px; height:28px; display:flex; align-items:center; justify-content:center;
}

/* ===== Canvas Wrap ===== */
.canvas-wrap{
  flex:1; width:100%; position:relative; overflow:hidden;
  background:#F5F0FF; outline:2px solid #D1C4E9;
  touch-action:manipulation;
}

/* ===== Grating Canvas ===== */
#gratingCanvas{
  position:absolute; top:0; left:0; width:100%; height:100%;
  pointer-events:none; z-index:1;
}

/* ===== Grid Container ===== */
#gridContainer{
  position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
  display:grid; gap:10px; z-index:2;
}
.grid-cell{
  background:rgba(255,255,255,0.97);
  border:2.5px solid #D1C4E9; border-radius:14px;
  display:flex; align-items:center; justify-content:center;
  font-weight:800; color:#3F51B5;
  cursor:pointer; transition:all 0.12s ease;
  box-shadow:0 3px 8px rgba(92,107,192,0.12);
  user-select:none; -webkit-user-select:none;
  -webkit-tap-highlight-color:transparent;
}
.grid-cell:hover{
  border-color:#7986CB; box-shadow:0 4px 14px rgba(92,107,192,0.2);
}
.grid-cell:active{
  transform:scale(0.92); background:#EDE7F6;
}
.grid-cell.correct{
  background:#C8E6C9; border-color:#66BB6A; color:#2E7D32;
  animation:pop-correct 0.4s ease forwards;
  pointer-events:none;
}
.grid-cell.wrong{
  animation:shake 0.4s ease;
  background:#FFEBEE; border-color:#EF5350;
}
@keyframes pop-correct{
  0%{transform:scale(1)} 30%{transform:scale(1.15)} 100%{transform:scale(0.6);opacity:0}
}
@keyframes shake{
  0%,100%{transform:translateX(0)} 20%{transform:translateX(-6px)}
  40%{transform:translateX(6px)} 60%{transform:translateX(-4px)} 80%{transform:translateX(4px)}
}
.grid-cell.disabled{pointer-events:none;opacity:0.7}

/* ===== Overlays ===== */
.overlay{
  position:absolute; inset:0; background:rgba(237,231,246,0.94);
  display:flex; align-items:center; justify-content:center;
  z-index:20; backdrop-filter:blur(6px);
}
.overlay.hidden{display:none}
.overlay-card{
  text-align:center; padding:36px; max-width:380px;
}
.overlay-card .icon-big{font-size:3.5rem;display:block;margin-bottom:8px}
.overlay-card h2{font-size:1.4rem;color:#3F51B5;margin-bottom:10px}
.overlay-card p{font-size:0.88rem;color:#666;margin-bottom:8px;line-height:1.5}
.diff-select{display:flex;gap:8px;justify-content:center;margin:14px 0}
.diff-btn{
  padding:8px 18px; border-radius:24px; border:2px solid #D1C4E9;
  background:#FFF; color:#5C6BC0; font-size:0.82rem;
  font-weight:600; cursor:pointer; transition:all 0.2s;
  user-select:none; -webkit-user-select:none;
}
.diff-btn:hover{background:#EDE7F6}
.diff-btn.active{background:#5C6BC0;color:#FFF;border-color:#5C6BC0}

.btn-go{
  padding:10px 32px; border-radius:28px; border:none;
  background:linear-gradient(135deg,#5C6BC0,#3F51B5);
  color:#FFF; font-size:1rem; font-weight:700;
  cursor:pointer; box-shadow:0 4px 16px rgba(92,107,192,0.3);
  transition:all 0.2s; letter-spacing:1px;
}
.btn-go:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(92,107,192,0.4)}
.btn-go:active{transform:translateY(0)}
.btn-go:disabled{opacity:0.5;cursor:not-allowed;pointer-events:none}

/* ===== End Result Card ===== */
.result-card{text-align:center}
.result-card .result-icon{font-size:3rem;display:block;margin-bottom:6px}
.result-card h2{font-size:1.3rem;color:#3F51B5;margin-bottom:6px}
.result-card .result-stats{
  display:grid; grid-template-columns:1fr 1fr; gap:8px;
  margin:14px 0; text-align:left;
}
.result-stat{
  background:#F5F0FF; border-radius:10px; padding:10px 12px;
}
.result-stat .rs-label{font-size:0.72rem;color:#7986CB}
.result-stat .rs-value{font-size:1.1rem;font-weight:700;color:#3F51B5}
.result-card .stars{font-size:2rem;margin:6px 0}
.result-card .tip{font-size:0.8rem;color:#EF5350;margin-top:8px}

/* ===== Toast ===== */
.toast{
  position:fixed;top:50px;left:50%;transform:translateX(-50%);
  background:#3F51B5;color:#FFF;padding:10px 24px;
  border-radius:24px;font-weight:700;font-size:0.9rem;
  z-index:100; opacity:0; transition:opacity 0.3s;
  pointer-events:none;
}
.toast.show{opacity:1}
</style>
</head>
<body>

<!-- Top Bar -->
<div class="top-bar">
  <a href="index.html#games" class="back-link">&#8592; 返回游戏</a>
  <div class="top-bar-right">
    <span class="timer-display" id="hudTimer">2:00</span>
    <span class="sound-btn" id="soundToggle" onclick="toggleSound()" title="音效">🔊</span><a href="contact.html" style="font-size:15px;text-decoration:none;margin-left:6px;color:var(--blue)" title="联系我们">📬</a>
  </div>
</div>

<!-- Canvas Wrap -->
<div class="canvas-wrap" id="canvasWrap">
  <canvas id="gratingCanvas"></canvas>
  <div id="gridContainer"></div>

  <!-- Start Overlay -->
  <div class="overlay" id="startOverlay">
    <div class="overlay-card">
      <span class="icon-big">🔢</span>
      <h2>舒尔特方格训练</h2>
      <p>按 <b>1 → 2 → 3 → …</b> 顺序<br>快速点击方格中的数字</p>
      <div class="diff-select" id="diffSelect">
        <button class="diff-btn active" data-diff="easy">3×3 入门</button>
        <button class="diff-btn" data-diff="medium">4×4 初级</button>
        <button class="diff-btn" data-diff="hard">5×5 进阶</button>
      </div>
      <button class="btn-go" id="btnStart">开始训练</button>
    </div>
  </div>

  <!-- Cover Reminder -->
  <div class="overlay hidden" id="coverOverlay">
    <div class="overlay-card">
      <span class="icon-big">🩺</span>
      <h2>遮盖提醒</h2>
      <p>请<b>遮盖健眼（好眼）</b>，<br>仅用<b>弱视眼</b>进行训练。</p>
      <p style="font-size:0.78rem;color:#EF5350;">· 佩戴矫正镜片 · 屏幕距眼 30-40cm · 环境光充足</p>
      <button class="btn-go" id="btnReady">准备好了</button>
    </div>
  </div>

  <!-- End Overlay -->
  <div class="overlay hidden" id="endOverlay">
    <div class="overlay-card result-card" id="endCard"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   舒尔特方格 — 视觉搜索+抗干扰注视训练
   Canvas 960×540 base, responsive scaling
   动态光栅背景（半透明条纹平移，训练抗干扰扫描能力）
   HTML CSS Grid 数字格
   ============================================================ */

/* ── localStorage 进度系统 ── */
const PROGRESS_KEY='amblyopia_progress';
function initProgress(){let r=localStorage.getItem(PROGRESS_KEY);if(!r){const p={version:1,totalPoints:0,streak:{current:0,best:0,lastDate:''},games:{'whack-a-mole':{plays:0,bestScore:0,totalHits:0,totalMisses:0,bestCombo:0},'spot-difference':{plays:0,bestScore:0,totalCorrect:0,totalWrong:0},'matching-game':{plays:0,bestScore:0,totalPairs:0,bestCombo:0},'maze-game':{plays:0,bestScore:0,totalMazes:0,fastestTime:null},'chase-the-light':{plays:0,bestScore:0,totalCaptures:0,bestCombo:0},'fly-swatter':{plays:0,bestScore:0,totalKills:0,totalEscapes:0},'zombie-whacker':{plays:0,bestScore:0,totalKills:0,totalEscapes:0},'schulte-grid':{plays:0,bestScore:0,totalHits:0,totalMisses:0}},calendar:{},achievements:[],settings:{difficulties:{}}};localStorage.setItem(PROGRESS_KEY,JSON.stringify(p));return p;}try{return JSON.parse(r);}catch(e){return null;}}
function getToday(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
const ACH=[{id:'first_game',check(p){return p.totalPoints>0;}},{id:'five_games',check(p){return Object.values(p.games).filter(g=>g.plays>0).length>=6;}},{id:'high_score_200',check(p){return Object.values(p.games).some(g=>g.bestScore>=200);}},{id:'streak_3',check(p){return p.streak.best>=3;}},{id:'streak_7',check(p){return p.streak.best>=7;}},{id:'total_1000',check(p){return p.totalPoints>=1000;}},{id:'no_escape',check(p){const g=p.games['zombie-whacker'];return g.plays>0&&g.totalEscapes===0;}},{id:'ten_plays',check(p){return Object.values(p.games).reduce((s,g)=>s+g.plays,0)>=10;}},{id:'perfect_whack',check(p){const g=p.games['whack-a-mole'];return g.totalHits>=10&&g.totalHits/(g.totalHits+g.totalMisses)>=0.9;}}];
function saveGameResult(gameId,data){let p=initProgress();if(!p)return;const g=p.games[gameId];g.plays++;if(data.score>g.bestScore)g.bestScore=data.score;if(data.hits!==undefined)g.totalHits=(g.totalHits||0)+data.hits;if(data.misses!==undefined)g.totalMisses=(g.totalMisses||0)+data.misses;if(data.combo!==undefined&&data.combo>(g.bestCombo||0))g.bestCombo=data.combo;if(data.correct!==undefined)g.totalCorrect=(g.totalCorrect||0)+data.correct;if(data.wrong!==undefined)g.totalWrong=(g.totalWrong||0)+data.wrong;if(data.pairs!==undefined)g.totalPairs=(g.totalPairs||0)+data.pairs;if(data.mazes!==undefined)g.totalMazes=(g.totalMazes||0)+data.mazes;if(data.time!==undefined&&(g.fastestTime===null||data.time<g.fastestTime))g.fastestTime=data.time;if(data.captures!==undefined)g.totalCaptures=(g.totalCaptures||0)+data.captures;if(data.kills!==undefined)g.totalKills=(g.totalKills||0)+data.kills;if(data.escapes!==undefined)g.totalEscapes=(g.totalEscapes||0)+data.escapes;p.totalPoints+=data.score;const today=getToday();if(!p.calendar[today])p.calendar[today]={points:0,gamesPlayed:0,duration:0};p.calendar[today].points+=data.score;p.calendar[today].gamesPlayed++;p.calendar[today].duration+=data.duration||120;updateStreak(p,today);checkAch(p);if(data.difficulty)p.settings.difficulties[gameId]=data.difficulty;localStorage.setItem(PROGRESS_KEY,JSON.stringify(p));}
function updateStreak(p,today){if(!p.streak.lastDate){p.streak.current=1;p.streak.lastDate=today;}else{const last=new Date(p.streak.lastDate),curr=new Date(today);const diff=Math.floor((curr-last)/86400000);if(diff===1)p.streak.current++;else if(diff>1)p.streak.current=1;p.streak.lastDate=today;}if(p.streak.current>p.streak.best)p.streak.best=p.streak.current;}
function checkAch(p){const unlocked=new Set(p.achievements.map(a=>a.id));for(const ach of ACH){if(!unlocked.has(ach.id)&&ach.check(p)){p.achievements.push({id:ach.id,unlockedAt:getToday()});}}}

/* ── Canvas & DOM refs ── */
const gratingCanvas = document.getElementById('gratingCanvas');
const gctx = gratingCanvas.getContext('2d');
const wrap = document.getElementById('canvasWrap');

/* ── Constants ── */
const BASE_W = 960, BASE_H = 540;
const TOTAL_TIME = 120; // 2 minutes

/* ── Difficulty ── */
const DIFFICULTY = {
  easy:   { n:3, label:'3×3 入门',   cellSize:120, fontSize:48 },
  medium: { n:4, label:'4×4 初级',   cellSize: 90, fontSize:36 },
  hard:   { n:5, label:'5×5 进阶',   cellSize: 72, fontSize:28 }
};

let diff = 'easy';
let cfg = DIFFICULTY[diff];

/* ── State ── */
let grid = [];
let nextTarget = 1;
let score = 0;
let totalClicks = 0;
let correctClicks = 0;
let timeLeft = TOTAL_TIME;
let running = false;
let completed = false;
let animId = null;
let timerInterval = null;
let gratingOffset = 0;
let lastGratingTime = 0;
let gratingMode = 0;
let gratingModeTimer = 0;

/* ── Audio ── */
let audioCtx = null;
let soundOn = true;
function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  return audioCtx;
}
function toggleSound(){
  soundOn = !soundOn;
  document.getElementById('soundToggle').textContent = soundOn ? '🔊' : '🔇';
  if(soundOn) getAudioCtx();
}
function playCorrect() {
  if(!soundOn) return;
  try {
    const ac = getAudioCtx();
    const t = ac.currentTime;
    const osc = ac.createOscillator(); osc.type='sine'; osc.frequency.setValueAtTime(660,t); osc.frequency.linearRampToValueAtTime(880,t+0.08);
    const gain = ac.createGain(); gain.gain.setValueAtTime(0.25,t); gain.gain.exponentialRampToValueAtTime(0.01,t+0.15);
    osc.connect(gain).connect(ac.destination);
    osc.start(t); osc.stop(t+0.15);
  } catch(e) {}
}
function playWrong() {
  if(!soundOn) return;
  try {
    const ac = getAudioCtx();
    const t = ac.currentTime;
    const osc = ac.createOscillator(); osc.type='square'; osc.frequency.setValueAtTime(180,t); osc.frequency.linearRampToValueAtTime(120,t+0.15);
    const gain = ac.createGain(); gain.gain.setValueAtTime(0.12,t); gain.gain.exponentialRampToValueAtTime(0.01,t+0.2);
    osc.connect(gain).connect(ac.destination);
    osc.start(t); osc.stop(t+0.2);
  } catch(e) {}
}
function playVictory() {
  if(!soundOn) return;
  try {
    const ac = getAudioCtx();
    const t = ac.currentTime;
    const notes = [523,659,784,1047];
    notes.forEach((f,i) => {
      const osc = ac.createOscillator(); osc.type='sine'; osc.frequency.value=f;
      const gain = ac.createGain(); gain.gain.setValueAtTime(0.2,t+i*0.12); gain.gain.exponentialRampToValueAtTime(0.01,t+i*0.12+0.25);
      osc.connect(gain).connect(ac.destination);
      osc.start(t+i*0.12); osc.stop(t+i*0.12+0.25);
    });
  } catch(e) {}
}
function playTimeout() {
  if(!soundOn) return;
  try {
    const ac = getAudioCtx();
    const t = ac.currentTime;
    const osc = ac.createOscillator(); osc.type='sawtooth'; osc.frequency.setValueAtTime(300,t); osc.frequency.linearRampToValueAtTime(100,t+0.5);
    const gain = ac.createGain(); gain.gain.setValueAtTime(0.15,t); gain.gain.exponentialRampToValueAtTime(0.01,t+0.6);
    osc.connect(gain).connect(ac.destination);
    osc.start(t); osc.stop(t+0.6);
  } catch(e) {}
}

/* ── Toast ── */
const toast = document.getElementById('toast');
let toastTimer = null;
function showToast(msg) {
  toast.textContent = msg; toast.classList.add('show');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { toast.classList.remove('show'); }, 1500);
}

/* ── Grating Background ── */
function drawGrating(timestamp) {
  if (!lastGratingTime) lastGratingTime = timestamp;
  const dt = Math.min((timestamp - lastGratingTime) / 1000, 0.1);
  lastGratingTime = timestamp;

  const SPEED = 200;
  const OPACITY = 1.0;
  const STRIPE_W = 20;
  const MODE_INTERVAL = 8;

  if (running) {
    gratingModeTimer += dt;
    if (gratingModeTimer >= MODE_INTERVAL) {
      gratingModeTimer = 0;
      gratingMode = (gratingMode + 1) % 2;
    }
  }

  gratingOffset = (gratingOffset + SPEED * dt) % (STRIPE_W * 2);

  const w = gratingCanvas.width, h = gratingCanvas.height;
  gctx.clearRect(0, 0, w, h);

  const sz = STRIPE_W * 2;

  if (gratingMode === 0) {
    for (let x = -gratingOffset; x < w; x += sz) {
      gctx.fillStyle = 'rgba(0,0,0,' + OPACITY + ')';
      gctx.fillRect(x, 0, STRIPE_W, h);
    }
  } else if (gratingMode === 1) {
    for (let y = -gratingOffset; y < h; y += sz) {
      gctx.fillStyle = 'rgba(0,0,0,' + OPACITY + ')';
      gctx.fillRect(0, y, w, STRIPE_W);
    }
  }
}

/* ── Resize ── */
function resize() {
  const rect = wrap.getBoundingClientRect();
  const scaleX = rect.width / BASE_W;
  const scaleY = rect.height / BASE_H;
  const s = Math.min(scaleX, scaleY);

  gratingCanvas.width = rect.width;
  gratingCanvas.height = rect.height;

  wrap.style.setProperty('--scale', s);
}

/* ── Generate Grid ── */
function generateGrid(n) {
  const total = n * n;
  const values = [];
  for (let i = 1; i <= total; i++) values.push(i);

  for (let i = values.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [values[i], values[j]] = [values[j], values[i]];
  }

  grid = values.map((v, idx) => ({
    value: v,
    row: Math.floor(idx / n),
    col: idx % n,
    done: false
  }));

  nextTarget = 1;
}

/* ── Render Grid ── */
function renderGrid() {
  const container = document.getElementById('gridContainer');
  const n = cfg.n;
  container.innerHTML = '';

  const cellPx = cfg.cellSize;
  container.style.gridTemplateColumns = `repeat(${n}, ${cellPx}px)`;
  container.style.gridTemplateRows = `repeat(${n}, ${cellPx}px)`;
  // 医学修正: 困难档格间距+2px，缓解弱视拥挤效应
  container.style.gap = (n >= 5 ? 12 : 10) + 'px';

  const totalW = n * cellPx + (n - 1) * 10;
  const totalH = n * cellPx + (n - 1) * 10;
  container.style.width = totalW + 'px';
  container.style.height = totalH + 'px';

  const sortedByPos = [...grid].sort((a, b) => (a.row * n + a.col) - (b.row * n + b.col));

  sortedByPos.forEach((cell) => {
    const div = document.createElement('div');
    div.className = 'grid-cell';
    div.style.fontSize = cfg.fontSize + 'px';
    div.style.width = cellPx + 'px';
    div.style.height = cellPx + 'px';
    div.textContent = cell.value;

    if (cell.done) {
      div.classList.add('correct');
    }

    div.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      handleCellClick(cell, div);
    });

    container.appendChild(div);
  });

  const allCells = container.querySelectorAll('.grid-cell');
  sortedByPos.forEach((cell, i) => {
    cell._el = allCells[i];
  });
}

/* ── Handle Cell Click ── */
function handleCellClick(cell, el) {
  if (!running || cell.done) return;

  totalClicks++;

  if (cell.value === nextTarget) {
    correctClicks++;
    score += 10;
    cell.done = true;
    el.classList.add('correct');
    playCorrect();

    if (nextTarget === cfg.n * cfg.n) {
      completed = true;
      endGame(true);
    } else {
      nextTarget++;
    }
  } else {
    el.classList.add('wrong');
    setTimeout(() => el.classList.remove('wrong'), 400);
    playWrong();
  }
}

/* ── Update Timer Display ── */
function updateTimer() {
  const m = Math.floor(timeLeft / 60);
  const s = timeLeft % 60;
  document.getElementById('hudTimer').textContent = m + ':' + String(s).padStart(2, '0');
}

/* ── Animation Loop ── */
function animate(timestamp) {
  drawGrating(timestamp);
  animId = requestAnimationFrame(animate);
}

/* ── Game Loop ── */
function startGame() {
  score = 0;
  totalClicks = 0;
  correctClicks = 0;
  nextTarget = 1;
  timeLeft = TOTAL_TIME;
  running = true;
  completed = false;
  lastGratingTime = 0;
  gratingMode = 0;
  gratingModeTimer = 0;

  document.getElementById('startOverlay').classList.add('hidden');
  document.getElementById('coverOverlay').classList.add('hidden');
  document.getElementById('endOverlay').classList.add('hidden');

  document.querySelectorAll('#diffSelect .diff-btn').forEach(b => b.disabled = true);

  generateGrid(cfg.n);
  renderGrid();
  updateTimer();

  if (timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    timeLeft--;
    updateTimer();
    if (timeLeft <= 0) {
      endGame(false);
    }
  }, 1000);

  if (animId) cancelAnimationFrame(animId);
  animId = requestAnimationFrame(animate);
}

/* ── End Game ── */
function endGame(finished) {
  running = false;
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
  if (animId) { cancelAnimationFrame(animId); animId = null; }

  document.querySelectorAll('#gridContainer .grid-cell').forEach(el => {
    el.classList.add('disabled');
  });

  document.querySelectorAll('#diffSelect .diff-btn').forEach(b => b.disabled = false);

  const n = cfg.n;
  const total = n * n;
  const accuracy = totalClicks > 0 ? Math.round(correctClicks / totalClicks * 100) : 0;
  const timeTaken = TOTAL_TIME - timeLeft;

  let stars = 0, ratingText = '';
  if (finished) {
    const completionPercent = correctClicks / total;
    if (completionPercent >= 1 && accuracy >= 95 && timeTaken < 30) { stars = 3; ratingText = '太棒了！'; }
    else if (completionPercent >= 1 && accuracy >= 80) { stars = 3; ratingText = '优秀！'; }
    else if (completionPercent >= 0.7 && accuracy >= 70) { stars = 2; ratingText = '不错！'; }
    else if (completionPercent >= 0.5) { stars = 2; ratingText = '继续加油'; }
    else { stars = 1; ratingText = '再练一次'; }
  } else {
    const completionPercent = correctClicks / total;
    if (completionPercent >= 0.8) { stars = 2; ratingText = '差一点！'; }
    else if (completionPercent >= 0.5) { stars = 1; ratingText = '继续加油'; }
    else { stars = 1; ratingText = '慢慢来'; }
  }

  if (finished) playVictory(); else playTimeout();

  const starEmoji = {1:'⭐',2:'⭐⭐',3:'⭐⭐⭐'};
  const icons = {3:'🏆',2:'🎯',1:'💪'};

  document.getElementById('endCard').innerHTML =
    '<span class="result-icon">' + icons[stars] + '</span>' +
    '<h2>' + (finished ? '全部完成！' : '时间到') + '</h2>' +
    '<div class="stars">' + starEmoji[stars] + '</div>' +
    '<p style="font-size:0.85rem;color:#5C6BC0;font-weight:600;margin-bottom:10px">' + ratingText + '</p>' +
    '<div class="result-stats">' +
      '<div class="result-stat"><div class="rs-label">得分</div><div class="rs-value">' + score + '</div></div>' +
      '<div class="result-stat"><div class="rs-label">正确</div><div class="rs-value">' + correctClicks + '/' + total + '</div></div>' +
      '<div class="result-stat"><div class="rs-label">准确率</div><div class="rs-value">' + accuracy + '%</div></div>' +
      '<div class="result-stat"><div class="rs-label">用时</div><div class="rs-value">' + timeTaken + 's</div></div>' +
    '</div>' +
    '<button class="btn-go" style="margin-top:12px" onclick="restartGame()">再玩一次</button>';

  document.getElementById('endOverlay').classList.remove('hidden');

  saveGameResult('schulte-grid', {
    score: score,
    hits: correctClicks,
    misses: totalClicks - correctClicks,
    duration: timeTaken,
    difficulty: diff
  });
}
function restartGame() {
  document.getElementById('endOverlay').classList.add('hidden');
  document.getElementById('coverOverlay').classList.remove('hidden');
}

/* ── Event Listeners ── */
document.querySelectorAll('#diffSelect .diff-btn').forEach(btn => {
  btn.addEventListener('click', function() {
    document.querySelectorAll('#diffSelect .diff-btn').forEach(b => b.classList.remove('active'));
    this.classList.add('active');
    diff = this.dataset.diff;
    cfg = DIFFICULTY[diff];
  });
});

document.getElementById('btnStart').addEventListener('click', () => {
  document.getElementById('startOverlay').classList.add('hidden');
  document.getElementById('coverOverlay').classList.remove('hidden');
});

document.getElementById('btnReady').addEventListener('click', startGame);

/* ── Initialize ── */
function init() {
  resize();
  window.addEventListener('resize', resize);

  const STRIPE_W = 20, OP = 1.0;
  for (let x = 0; x < gratingCanvas.width; x += STRIPE_W * 2) {
    gctx.fillStyle = 'rgba(0,0,0,' + OP + ')';
    gctx.fillRect(x, 0, STRIPE_W, gratingCanvas.height);
  }

  generateGrid(cfg.n);
  renderGrid();
  updateTimer();
  resetGridDisplay();
}

function resetGridDisplay() {
  document.querySelectorAll('#gridContainer .grid-cell').forEach(el => {
    el.classList.add('disabled');
  });
}

init();
</script>
<script>if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js')}</script>
