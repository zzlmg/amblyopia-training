<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>对齐大师 · 太阳花弱视训练</title>
<link rel="manifest" href="manifest.json">
<style>
:root { --blue:#F9A825; --blue-light:#FFF8E1; --pink:#EF6C00; --pink-light:#FFF3E0;
  --green:#388E3C; --green-light:#E8F5E9; --purple:#1976D2; --purple-light:#E3F2FD;
  --text:#3E2723; --text-muted:#8D6E63; --bg:#FFFBF0; --card-bg:#fff; --radius:24px; --radius-sm:16px; }
*{margin:0;padding:0;box-sizing:border-box}
html,body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);height:100vh;width:100vw;overflow:hidden;
  display:flex;flex-direction:column;user-select:none;-webkit-user-select:none;touch-action:manipulation}

.top-bar{position:absolute;top:0;left:0;right:0;height:38px;z-index:10;
  background:rgba(0,0,0,0.18);backdrop-filter:blur(6px);
  display:flex;align-items:center;justify-content:space-between;padding:0 12px}
.back-link{text-decoration:none;color:#FFD54F;font-weight:600;font-size:14px;display:flex;align-items:center;gap:4px}
.hud{display:flex;align-items:center;gap:10px;color:#fff;font-size:14px;font-weight:700}
.hud-timer{background:rgba(255,255,255,0.2);padding:2px 10px;border-radius:10px;display:none}
.sound-btn{background:none;border:none;color:#fff;font-size:16px;cursor:pointer;padding:2px 4px}
.score-hud{position:absolute;top:48px;right:12px;z-index:5;background:rgba(0,0,0,0.35);color:#FFD54F;padding:4px 12px;border-radius:12px;font-weight:800;font-size:15px;display:none}

.canvas-wrap{flex:1;width:100%;position:relative;overflow:hidden;background:#f5f3ed;display:flex;align-items:center;justify-content:center}
canvas{display:block;max-width:100%;max-height:100%;touch-action:manipulation}

.ctrl-row{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);display:flex;gap:16px;z-index:5}
.ctrl-btn{width:56px;height:56px;border-radius:50%;border:3px solid rgba(0,0,0,0.15);background:rgba(255,255,255,0.9);font-size:28px;cursor:pointer;transition:all 0.15s;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,0.08)}
.ctrl-btn:active{transform:scale(0.9);background:var(--blue-light)}
.ctrl-confirm{padding:0 32px;border-radius:30px;border:none;background:linear-gradient(135deg,var(--blue),var(--pink));color:#fff;font-size:15px;font-weight:700;cursor:pointer;box-shadow:0 4px 16px rgba(249,168,37,0.3);transition:transform 0.15s}
.ctrl-confirm:active{transform:scale(0.96)}

.mascot{position:absolute;right:10px;bottom:90px;z-index:6;transition:all 0.4s}
.mascot img{width:56px;height:56px;animation:mascot-float 3s ease-in-out infinite}
@keyframes mascot-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px}
.overlay.hidden{display:none}
.overlay-card{background:var(--card-bg);border-radius:var(--radius);padding:28px 24px;max-width:420px;width:100%;text-align:center;border:2px solid #f0f0f5;box-shadow:0 6px 30px rgba(0,0,0,0.12)}
.overlay-card h2{font-size:22px;margin-bottom:6px}
.overlay-card p{font-size:14px;color:var(--text-muted);line-height:1.7;margin:6px 0}
.diff-select{display:flex;gap:8px;margin:14px 0;justify-content:center;flex-wrap:wrap}
.diff-btn{padding:8px 18px;border-radius:24px;border:2px solid #e0e0e0;background:transparent;font-size:14px;font-weight:600;cursor:pointer;transition:all 0.2s;color:var(--text-muted);font-family:inherit}
.diff-btn:hover{border-color:var(--blue);color:var(--blue)}
.diff-btn.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.patch-box{background:var(--blue-light);border:2px solid #FFE082;border-radius:14px;padding:12px 14px;margin:12px 0;font-size:12px;color:#F57C00;font-weight:600;line-height:1.6;text-align:left}
.btn-go{display:inline-block;padding:12px 36px;border-radius:30px;font-size:16px;font-weight:700;cursor:pointer;border:none;background:linear-gradient(135deg,var(--blue),var(--pink));color:#fff;box-shadow:0 4px 20px rgba(249,168,37,0.4);transition:transform 0.15s;font-family:inherit;margin-top:10px}
.btn-go:hover{transform:translateY(-2px)}.btn-go:active{transform:scale(0.96)}
.result-score{font-size:44px;font-weight:900;color:var(--blue);margin:6px 0}
@media(max-width:500px){.overlay-card{padding:22px 16px}.ctrl-btn{width:48px;height:48px;font-size:24px}}
</style>
</head>
<body>
<div class="top-bar">
  <a href="index.html#games" class="back-link">&#8592; 返回游戏</a>
  <div class="hud">
    <span class="hud-timer" id="timerHud">2:00</span>
    <button class="sound-btn" id="soundBtn" onclick="toggleSound()">🔊</button><a href="contact.html" style="font-size:15px;text-decoration:none;margin-left:6px;color:var(--blue)" title="联系我们">📬</a>
  </div>
</div>
<div class="canvas-wrap" id="canvasWrap">
  <canvas id="gameCanvas"></canvas>
  <div class="score-hud" id="scoreHud">⭐ 0</div>
  <div class="ctrl-row" id="ctrlRow" style="display:none">
    <button class="ctrl-btn" onclick="shiftLine(-1)" aria-label="左移">&#8592;</button>
    <button class="ctrl-confirm" onclick="confirmAlign()">确认 ✓</button>
    <button class="ctrl-btn" onclick="shiftLine(1)" aria-label="右移">&#8594;</button>
  </div>
  <div class="mascot" id="mascot"><img src="mascot/sunflower-smile.png" alt="小葵" id="mascotImg"></div>
</div>

<div class="overlay" id="startOverlay">
  <div class="overlay-card">
    <h2>📏 对齐大师</h2>
    <p>Vernier 游标锐度训练<br>两段竖线是否对齐？移动下方线段<br>让它们完全对齐后确认！</p>
    <div class="diff-select" id="diffSelect">
      <button class="diff-btn active" data-diff="easy">简单</button>
      <button class="diff-btn" data-diff="medium">中等</button>
      <button class="diff-btn" data-diff="hard">困难</button>
    </div>
    <div class="patch-box">&#x1f6d1; 遮盖健眼 · 弱视眼单独操作</div>
    <button class="btn-go" onclick="startGame()">准备好了，开始！</button>
  </div>
</div>
<div class="overlay hidden" id="endOverlay"><div class="overlay-card" id="endCard"></div></div>

<script>
var BASE_W=560, BASE_H=400;
var DIFFICULTY={
  easy:{label:'简单',lineW:6,gapPx:20,offsetMin:14,offsetMax:22,shiftsToAlign:4,points:10},
  medium:{label:'中等',lineW:4,gapPx:14,offsetMin:8,offsetMax:16,shiftsToAlign:2,points:20},
  hard:{label:'困难',lineW:2.5,gapPx:8,offsetMin:2,offsetMax:10,shiftsToAlign:1,points:30}
};
var currentDiff='easy',cfg=DIFFICULTY[currentDiff];
var score=0,correct=0,total=0,running=false,timeLeft=120,timerId=null;
var lineOffset=0,currentOffset=0,cx=0,cy=0,lineLen=140;
var audioCtx=null,soundOn=true;

var canvas,ctx;
function resizeCanvas(){
  canvas=document.getElementById('gameCanvas');ctx=canvas.getContext('2d');
  var r=document.getElementById('canvasWrap').getBoundingClientRect(),w=r.width,h=r.height,dpr=window.devicePixelRatio||1;
  canvas.width=w*dpr;canvas.height=h*dpr;canvas.style.width=w+'px';canvas.style.height=h+'px';
  ctx.setTransform(1,0,0,1,0,0);
  var s=Math.min(dpr*w/BASE_W,dpr*h/BASE_H);
  ctx.translate((dpr*w-s*BASE_W)/2,(dpr*h-s*BASE_H)/2);ctx.scale(s,s);
}
resizeCanvas();window.addEventListener('resize',function(){resizeCanvas();if(running)drawLines()});

function initAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)()}
function beep(f,d,v){if(!audioCtx||!soundOn)return;try{var o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(v,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+d);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+d)}catch(e){}}
function playCorrect(){beep(660,0.08,0.06);setTimeout(function(){beep(880,0.1,0.06)},80)}
function playWrong(){beep(200,0.12,0.04,'square');beep(200,0.12,0.04,'square')}
function toggleSound(){soundOn=!soundOn;document.getElementById('soundBtn').textContent=soundOn?'🔊':'🔇';if(soundOn)initAudio()}

function drawLines(){
  ctx.clearRect(0,0,BASE_W,BASE_H);ctx.fillStyle='#f5f3ed';ctx.fillRect(0,0,BASE_W,BASE_H);
  cx=BASE_W/2;cy=BASE_H/2;var lw=cfg.lineW,gap=cfg.gapPx;
  // Top line (anchor, fixed)
  ctx.fillStyle='#3a3a3a';ctx.fillRect(cx-lw/2,cy-gap/2-lineLen/2,lw,lineLen/2);
  // Gap marker
  ctx.fillStyle='rgba(0,0,0,0.06)';ctx.fillRect(cx-30,cy-gap/2,60,gap);
  // Bottom line (movable)
  ctx.fillStyle='#3a3a3a';ctx.fillRect(cx-lw/2+currentOffset,cy+gap/2,lw,lineLen/2);
  // Center hint
  ctx.strokeStyle='rgba(0,0,0,0.04)';ctx.lineWidth=0.5;ctx.setLineDash([3,8]);
  ctx.beginPath();ctx.moveTo(cx,cy-gap/2-lineLen/2-8);ctx.lineTo(cx,cy+gap/2+lineLen/2+8);ctx.stroke();ctx.setLineDash([]);
}

function shiftLine(dir){
  if(!running)return;
  currentOffset+=dir*2;
  currentOffset=Math.max(-50,Math.min(50,currentOffset));
  drawLines();
}

function confirmAlign(){
  if(!running)return;total++;
  var error=Math.abs(currentOffset); // are we back to center (aligned)?
  var threshold=cfg.lineW*0.6;
  var isCorrect=error<=threshold;
  if(isCorrect){
    correct++;score+=cfg.points;
    document.getElementById('scoreHud').textContent='⭐ '+score;
    playCorrect();setMascot('celebrate');
    // Gold flash
    ctx.strokeStyle='rgba(249,168,37,0.5)';ctx.lineWidth=4;ctx.setLineDash([]);
    ctx.beginPath();ctx.arc(cx,cy,30,0,Math.PI*2);ctx.stroke();
  }else{
    playWrong();setMascot('worry');
    // Show correct position
    ctx.fillStyle='#f5f3ed';ctx.fillRect(cx-12+currentOffset,cy+cfg.gapPx/2,cfg.lineW,lineLen/2);
    ctx.fillStyle='rgba(239,108,0,0.3)';ctx.fillRect(cx-cfg.lineW/2+currentOffset,cy+cfg.gapPx/2,cfg.lineW,lineLen/2);
    setTimeout(function(){
      ctx.fillStyle='#f5f3ed';ctx.fillRect(cx-12+currentOffset,cy+cfg.gapPx/2,cfg.lineW,lineLen/2);
      ctx.fillStyle='rgba(56,142,60,0.4)';ctx.fillRect(cx-cfg.lineW/2,cy+cfg.gapPx/2,cfg.lineW,lineLen/2);
    },600);
  }
  setTimeout(newRound,1500);
}

function newRound(){
  var sign=Math.random()<0.5?1:-1;
  lineOffset=sign*(cfg.offsetMin+Math.random()*(cfg.offsetMax-cfg.offsetMin));
  currentOffset=lineOffset;drawLines();
}

function fmtTime(s){var m=Math.floor(s/60),sec=s%60;return m+':'+(sec<10?'0':'')+sec}
function tick(){if(!running)return;timeLeft--;document.getElementById('timerHud').textContent=fmtTime(timeLeft);if(timeLeft<=30)document.getElementById('timerHud').style.color='#FFD54F';if(timeLeft<=0)endGame()}
function setMascot(e){var img=document.getElementById('mascotImg');img.src='mascot/sunflower-'+e+'.png';img.onerror=function(){img.style.display='none'};img.onload=function(){img.style.display='block'}}
function startGame(){
  initAudio();if(!audioCtx){var a=new(window.AudioContext||window.webkitAudioContext)();a.resume();audioCtx=a}
  cfg=DIFFICULTY[currentDiff];score=0;correct=0;total=0;timeLeft=120;running=true;
  document.getElementById('startOverlay').classList.add('hidden');document.getElementById('endOverlay').classList.add('hidden');
  document.getElementById('scoreHud').style.display='block';document.getElementById('scoreHud').textContent='⭐ 0';
  document.getElementById('ctrlRow').style.display='flex';
  document.getElementById('timerHud').style.display='inline-block';document.getElementById('timerHud').textContent='2:00';document.getElementById('timerHud').style.color='#fff';
  setMascot('smile');timerId=setInterval(tick,1000);newRound();
}
function endGame(){
  running=false;if(timerId){clearInterval(timerId);timerId=null}
  document.getElementById('ctrlRow').style.display='none';document.getElementById('scoreHud').style.display='none';document.getElementById('timerHud').style.display='none';
  var acc=total>0?Math.round(correct/total*100):0;
  var grade=acc>=80?'🌻 游标锐度杠杠的！':acc>=50?'💪 对齐感在进步！':'🌱 戴上眼镜多练练！';
  document.getElementById('endCard').innerHTML='<h2>训练结束</h2><div class="result-score">'+score+'</div><p>分</p><p>正确 '+correct+' / '+total+' 题 · '+acc+'%</p><p style="font-size:16px;margin:8px 0">'+grade+'</p><div style="background:#FFF8E1;border:2px solid #FFE082;border-radius:14px;padding:12px;margin:12px 0;font-size:12px;color:#F57C00;line-height:1.6">👁 休息1-2分钟，远眺窗外<br>遮盖训练每天≤15分钟</div><button class="btn-go" onclick="startGame()">再来一局</button><p style="margin-top:12px"><a href="index.html" style="color:var(--blue);font-size:13px;font-weight:600;text-decoration:none">← 返回首页</a></p>';
  document.getElementById('endOverlay').classList.remove('hidden');
  setMascot(acc>=80?'celebrate':acc>=50?'cheer':'smile');
  ctx.fillStyle='#f5f3ed';ctx.fillRect(0,0,BASE_W,BASE_H);
}
document.querySelectorAll('#diffSelect .diff-btn').forEach(function(b){b.addEventListener('click',function(){
  document.querySelectorAll('#diffSelect .diff-btn').forEach(function(x){x.classList.remove('active')});b.classList.add('active');
  currentDiff=b.dataset.diff;cfg=DIFFICULTY[currentDiff];
})});
drawLines();
</script>
<script>if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js')}</script>
</body>
</html>
