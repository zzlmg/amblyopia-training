<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>连连看 — 弱视精细目力训练</title>
<link rel="manifest" href="manifest.json">
<style>
  :root {
    --blue: #4da6ff; --pink: #ff6b9d; --green: #45c4a0;
    --orange: #ffa940; --purple: #9b7ef0; --yellow: #ffd43b;
    --bg: #fefdf8; --text: #3a3a4a; --text-muted: #7a7a8a;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f5f3ed;
    height: 100vh; width: 100vw; overflow: hidden;
    display: flex; flex-direction: column;
    color: var(--text); user-select: none; -webkit-user-select: none;
  }

  /* ── 浮动顶栏 ── */
  .floating-bar {
    position: absolute; top: 0; left: 0; right: 0; height: 38px; z-index: 10;
    background: rgba(0,0,0,0.18); backdrop-filter: blur(6px);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 12px;
  }
  .floating-bar .back-link {
    text-decoration: none; color: #fff; font-weight: 600; font-size: 14px;
    opacity: 0.9; display: flex; align-items: center; gap: 4px;
  }
  .floating-bar .bar-right {
    display: flex; align-items: center; gap: 8px;
  }
  .floating-bar .bar-timer {
    color: #fff; font-size: 15px; font-weight: 700;
    background: rgba(255,255,255,0.2); padding: 2px 10px;
    border-radius: 10px; display: none;
  }
  .floating-bar .bar-sound {
    background: none; border: none; color: #fff; font-size: 16px;
    cursor: pointer; padding: 2px 4px; line-height: 1; opacity: 0.9;
  }
  .floating-bar .bar-sound.muted { opacity: 0.4; }
  .floating-bar .bar-hint {
    background: rgba(255,169,64,0.4); border: none; color: #fff;
    font-size: 14px; cursor: pointer; padding: 2px 8px;
    border-radius: 8px; font-weight: 700; display: none;
    line-height: 1; opacity: 0.9;
  }
  .floating-bar .bar-hint:active { opacity: 0.6; }

  /* ── 游戏区域 ── */
  .game-wrapper {
    flex: 1; width: 100%; display: flex; align-items: center;
    justify-content: center; padding: 50px 20px 20px;
  }
  .game-area {
    display: grid; width: 100%; max-width: 520px;
    justify-items: center; align-items: center;
    gap: 6px; padding: 8px;
    background: #fff; border-radius: 24px; border: 2px solid #d0ccc4;
    box-shadow: 0 4px 20px rgba(0,0,0,0.06);
    position: relative;
  }
  .cell {
    position: relative; cursor: pointer;
    border-radius: 12px; background: #f8f9fc;
    border: 2.5px solid transparent;
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.15s, border-color 0.15s, box-shadow 0.15s, background 0.15s;
    box-shadow: 0 2px 6px rgba(0,0,0,0.04);
    aspect-ratio: 1;
  }
  .cell:hover { transform: scale(1.05); box-shadow: 0 4px 14px rgba(0,0,0,0.08); }
  .cell:active { transform: scale(0.92); }
  .cell.empty {
    visibility: hidden; pointer-events: none;
  }
  .cell.selected {
    border-color: var(--purple) !important;
    box-shadow: 0 0 0 4px rgba(155,126,240,0.25) !important;
    background: #e8e0f8 !important;
    transform: scale(1.06);
  }
  .cell.hinted {
    animation: hintPulse 0.6s ease-in-out 3;
    border-color: var(--yellow) !important;
    box-shadow: 0 0 0 5px rgba(255,212,59,0.3) !important;
  }
  @keyframes hintPulse {
    0%,100% { transform: scale(1); }
    50% { transform: scale(1.1); }
  }
  .cell.matched {
    animation: matchPop 0.4s ease-out forwards;
    pointer-events: none;
  }
  @keyframes matchPop {
    0% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.15); opacity: 0.7; }
    100% { transform: scale(0); opacity: 0; }
  }
  .cell.wrong-flash {
    animation: wrongShake 0.35s ease-out;
    border-color: var(--pink) !important;
    background: #fff0f5 !important;
  }
  @keyframes wrongShake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-5px); }
    75% { transform: translateX(5px); }
  }

  .line-svg {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 100%; pointer-events: none; z-index: 5;
  }

  .combo-pop {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    font-size: 32px; font-weight: 900; pointer-events: none; z-index: 150;
    animation: comboBurst 0.7s ease-out forwards; white-space: nowrap;
  }
  @keyframes comboBurst {
    0% { opacity: 1; transform: translate(-50%, -50%) scale(0.5); }
    40% { opacity: 1; transform: translate(-50%, -50%) scale(1.2); }
    100% { opacity: 0; transform: translate(-50%, -70%) scale(1); }
  }

  .round-msg {
    position: fixed; top: 18%; left: 50%; transform: translateX(-50%);
    font-size: 20px; font-weight: 800; pointer-events: none;
    z-index: 100; padding: 10px 24px; border-radius: 50px;
    animation: roundMsgIn 0.4s ease-out, roundMsgOut 0.3s 1.5s ease-in forwards;
  }
  @keyframes roundMsgIn {
    from { opacity: 0; transform: translateX(-50%) translateY(-10px); }
    to { opacity: 1; transform: translateX(-50%) translateY(0); }
  }
  @keyframes roundMsgOut {
    from { opacity: 1; } to { opacity: 0; }
  }

  /* ── 遮罩层 ── */
  .overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.5); z-index: 200;
    display: flex; align-items: center; justify-content: center;
    animation: fadeIn 0.2s ease-out;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .overlay-card {
    background: #fff; border-radius: 28px; padding: 32px 28px;
    max-width: 400px; width: 90%; text-align: center;
    box-shadow: 0 12px 40px rgba(0,0,0,0.15);
    animation: modalIn 0.3s ease-out;
  }
  @keyframes modalIn {
    from { transform: translateY(20px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }
  .overlay-card h2 { font-size: 24px; font-weight: 800; margin-bottom: 12px; }
  .overlay-card p { font-size: 15px; color: var(--text-muted); margin-bottom: 20px; line-height: 1.6; }
  .overlay-card .highlight {
    background: #fff7e6; padding: 12px 16px; border-radius: 14px;
    border: 2px solid #ffe066; margin-bottom: 20px;
    font-size: 14px; color: #ba7517; font-weight: 600;
  }

  .btn {
    padding: 14px 36px; border-radius: 50px; border: none;
    font-size: 17px; font-weight: 700; cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .btn:active { transform: scale(0.96); }
  .btn-start {
    background: linear-gradient(135deg, #9b7ef0, #4da6ff);
    color: #fff; box-shadow: 0 4px 16px rgba(155,126,240,0.35);
  }
  .btn-start:hover { box-shadow: 0 6px 24px rgba(155,126,240,0.5); }

  /* 难度选择器（在 startOverlay 内） */
  .diff-selector-inline {
    display: flex; gap: 8px; justify-content: center;
    margin-bottom: 16px; flex-wrap: wrap;
  }
  .diff-btn {
    padding: 8px 18px; border-radius: 50px;
    border: 2px solid #e0e0e8; background: #fff;
    font-size: 14px; font-weight: 700; cursor: pointer;
    transition: all 0.2s; color: var(--text-muted);
  }
  .diff-btn.active { background: var(--purple); color: #fff; border-color: var(--purple); }

  /* ── 结果弹窗 ── */
  .result-card {
    background: #fff; border-radius: 28px; padding: 32px 28px;
    max-width: 420px; width: 90%; text-align: center;
    box-shadow: 0 12px 40px rgba(0,0,0,0.12);
  }
  .result-score { font-size: 56px; font-weight: 900; color: var(--orange); }
  .result-label { font-size: 14px; color: var(--text-muted); margin-bottom: 4px; }
  .result-stat {
    display: flex; justify-content: center; gap: 28px; margin: 18px 0; flex-wrap: wrap;
  }
  .result-stat-item { text-align: center; }
  .result-stat-value { font-size: 28px; font-weight: 800; }
  .result-stat-label { font-size: 12px; color: var(--text-muted); }
  .rest-reminder {
    background: #fffbe6; border: 2px solid #ffe066;
    border-radius: 16px; padding: 16px; margin: 16px 0;
    font-size: 14px; color: #ba7517; line-height: 1.6;
  }

  @media (max-width: 420px) {
    .game-area { gap: 4px; padding: 4px; }
  }
</style>
</head>
<body>

<!-- 浮动顶栏 -->
<div class="floating-bar">
  <a href="index.html#games" class="back-link">&#8592; 返回游戏</a>
  <div class="bar-right">
    <button class="bar-hint" id="barHint" onclick="showHint()">&#x1f4a1; 提示</button>
    <span class="bar-timer" id="barTimer">2:00</span>
    <button class="bar-sound" id="barSound" onclick="toggleSound()" title="音效">&#x1f50a;</button>
    <a href="contact.html" style="font-size:14px;text-decoration:none;color:var(--blue);margin-left:4px" title="联系我们">📬</a>
  </div>
</div>

<!-- 游戏区域 -->
<div class="game-wrapper">
  <div class="game-area" id="gameArea" style="position:relative;"></div>
</div>

<!-- 开始遮罩（包含难度选择+遮盖提醒） -->
<div class="overlay" id="startOverlay">
  <div class="overlay-card">
    <h2 style="font-size:28px;background:linear-gradient(135deg,#9b7ef0,#4da6ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;">连连看</h2>
    <p style="font-size:14px;color:var(--text-muted);margin-bottom:14px;">精细目力训练 · 图案识别 · 找到相同的一对消除</p>
    <div class="diff-selector-inline" id="diffSelector">
      <button class="diff-btn active" data-diff="easy">简单</button>
      <button class="diff-btn" data-diff="medium">中等</button>
      <button class="diff-btn" data-diff="hard">困难</button>
    </div>
    <div class="highlight">
      &#x1f6d1; 如果医生建议遮盖治疗，请先遮盖<strong>健眼（视力较好的眼睛）</strong><br>
      让弱视眼独立完成本次训练
    </div>
    <p style="font-size:14px;" id="startDiffInfo">
      难度：<strong>简单</strong> &nbsp; | &nbsp;
      网格：<strong>4×3</strong> &nbsp; | &nbsp;
      训练时长：<strong>2 分钟</strong><br>
      保持眼睛与屏幕 30~40cm 距离
    </p>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">
      &#x1f4a1; 找到相同图案，点击消除。路径转弯 ≤ <strong>2 次</strong><br>
      卡住时使用 <strong>提示</strong> 按钮
    </p>
    <button class="btn btn-start" onclick="beginGame()" style="margin-right:8px;">准备好了，开始！</button>
  </div>
</div>

<!-- 结束遮罩 -->
<div class="overlay" id="endOverlay" style="display:none;">
  <div class="result-card" id="endCard"></div>
</div>

<script>
  /* ── localStorage 进度系统 ── */
  const PROGRESS_KEY='amblyopia_progress';
  function initProgress(){let r=localStorage.getItem(PROGRESS_KEY);if(!r){const p={version:1,totalPoints:0,streak:{current:0,best:0,lastDate:''},games:{'whack-a-mole':{plays:0,bestScore:0,totalHits:0,totalMisses:0,bestCombo:0},'spot-difference':{plays:0,bestScore:0,totalCorrect:0,totalWrong:0},'matching-game':{plays:0,bestScore:0,totalPairs:0,bestCombo:0},'maze-game':{plays:0,bestScore:0,totalMazes:0,fastestTime:null},'chase-the-light':{plays:0,bestScore:0,totalCaptures:0,bestCombo:0},'fly-swatter':{plays:0,bestScore:0,totalKills:0,totalEscapes:0}},calendar:{},achievements:[],settings:{difficulties:{}}};localStorage.setItem(PROGRESS_KEY,JSON.stringify(p));return p;}try{return JSON.parse(r);}catch(e){return null;}}
  function getToday(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
  const ACH=[{id:'first_game',check(p){return p.totalPoints>0;}},{id:'five_games',check(p){return Object.values(p.games).filter(g=>g.plays>0).length>=6;}},{id:'high_score_200',check(p){return Object.values(p.games).some(g=>g.bestScore>=200);}},{id:'streak_3',check(p){return p.streak.best>=3;}},{id:'streak_7',check(p){return p.streak.best>=7;}},{id:'total_1000',check(p){return p.totalPoints>=1000;}},{id:'no_escape',check(p){const g=p.games['fly-swatter'];return g.plays>0&&g.totalEscapes===0;}},{id:'ten_plays',check(p){return Object.values(p.games).reduce((s,g)=>s+g.plays,0)>=10;}},{id:'perfect_whack',check(p){const g=p.games['whack-a-mole'];return g.totalHits>=10&&g.totalHits/(g.totalHits+g.totalMisses)>=0.9;}}];
  function saveGameResult(gameId,data){let p=initProgress();if(!p)return;const g=p.games[gameId];g.plays++;if(data.score>g.bestScore)g.bestScore=data.score;if(data.hits!==undefined)g.totalHits=(g.totalHits||0)+data.hits;if(data.misses!==undefined)g.totalMisses=(g.totalMisses||0)+data.misses;if(data.combo!==undefined&&data.combo>(g.bestCombo||0))g.bestCombo=data.combo;if(data.correct!==undefined)g.totalCorrect=(g.totalCorrect||0)+data.correct;if(data.wrong!==undefined)g.totalWrong=(g.totalWrong||0)+data.wrong;if(data.pairs!==undefined)g.totalPairs=(g.totalPairs||0)+data.pairs;if(data.mazes!==undefined)g.totalMazes=(g.totalMazes||0)+data.mazes;if(data.time!==undefined&&(g.fastestTime===null||data.time<g.fastestTime))g.fastestTime=data.time;if(data.captures!==undefined)g.totalCaptures=(g.totalCaptures||0)+data.captures;if(data.kills!==undefined)g.totalKills=(g.totalKills||0)+data.kills;if(data.escapes!==undefined)g.totalEscapes=(g.totalEscapes||0)+data.escapes;p.totalPoints+=data.score;const today=getToday();if(!p.calendar[today])p.calendar[today]={points:0,gamesPlayed:0,duration:0};p.calendar[today].points+=data.score;p.calendar[today].gamesPlayed++;p.calendar[today].duration+=data.duration||120;updateStreak(p,today);checkAch(p);if(data.difficulty)p.settings.difficulties[gameId]=data.difficulty;localStorage.setItem(PROGRESS_KEY,JSON.stringify(p));}
  function updateStreak(p,today){if(!p.streak.lastDate){p.streak.current=1;p.streak.lastDate=today;}else{const last=new Date(p.streak.lastDate),curr=new Date(today);const diff=Math.floor((curr-last)/86400000);if(diff===1)p.streak.current++;else if(diff>1)p.streak.current=1;p.streak.lastDate=today;}if(p.streak.current>p.streak.best)p.streak.best=p.streak.current;}
  function checkAch(p){const unlocked=new Set(p.achievements.map(a=>a.id));for(const ach of ACH){if(!unlocked.has(ach.id)&&ach.check(p)){p.achievements.push({id:ach.id,unlockedAt:getToday()});}}}
  const TOTAL_TIME = 120;

  /* ── 游戏逻辑 ── */
  /* 医学修正(PMC7764820): 移除红/绿emoji(R/G信号下降)，按难度逐级灰化 */
  const ICON_POOL_EASY = [
    '🍊','🍋','🍇','🐶','🐱','🐸','🦁','🐵','🐰','⭐','🌈','🎈','🚗','🌺','🎵','🌸','🌙','💎'
  ];
  const ICON_POOL_MEDIUM = [
    '🍑','🍇','🐶','🐱','🐻','🐼','🦁','🐵','🐢','🐍','🐦','🦉','🐧','⭐','✨','💫','🌙','💎'
  ];
  const ICON_POOL_HARD = [
    '🍊','🍋','🍑','🍌','🐶','🐱','🐻','🐼','🐦','🦉','🦜','🐸','🐢','🐊','⭐','✨','⚡','💙','💎','🌙'
  ];

  const DIFFICULTY = {
    easy:   { label: '简单', cols: 4, rows: 3, iconSize: 48, pool: ICON_POOL_EASY,  gap: 10, emptyCells: 2 },
    medium: { label: '中等', cols: 5, rows: 4, iconSize: 40, pool: ICON_POOL_MEDIUM, gap: 8,  emptyCells: 4 },
    hard:   { label: '困难', cols: 6, rows: 5, iconSize: 32, pool: ICON_POOL_HARD,   gap: 7,  emptyCells: 6 }
  };

  let currentDiff = 'easy';
  let score = 0, combo = 0, maxCombo = 0;
  let matchesFound = 0, wrongAttempts = 0, totalPairs = 0;
  let timeLeft = TOTAL_TIME;
  let gameRunning = false;
  let timerId = null;
  let selectedCell = null;
  let grid = [];
  let audioCtx = null;
  let hintCount = 0;
  let soundEnabled = true;

  function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
  function playBeep(freq, dur, vol = 0.08) {
    if (!audioCtx || !soundEnabled) return;
    try {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine'; osc.frequency.value = freq;
      gain.gain.setValueAtTime(vol, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(); osc.stop(audioCtx.currentTime + dur);
    } catch(e) {}
  }
  function playMatchSound()  { playBeep(523,0.06,0.06); playBeep(659,0.06,0.06); playBeep(784,0.10,0.07); }
  function playSelectSound() { playBeep(440,0.06,0.05); }
  function playWrongSound()  { playBeep(180,0.18,0.04); }
  function toggleSound() {
    soundEnabled = !soundEnabled;
    document.getElementById('barSound').classList.toggle('muted', !soundEnabled);
    document.getElementById('barSound').innerHTML = soundEnabled ? '&#x1f50a;' : '&#x1f507;';
  }

  function isLineClear(r1, c1, r2, c2) {
    const R = grid.length, C = grid[0].length;
    if (r1 === r2) {
      const minC = Math.min(c1, c2), maxC = Math.max(c1, c2);
      for (let c = minC; c <= maxC; c++) {
        if (c === c1 || c === c2) continue;
        if (r1 < 0 || r1 >= R || c < 0 || c >= C) continue;
        if (grid[r1][c] !== null) return false;
      }
      return true;
    }
    if (c1 === c2) {
      const minR = Math.min(r1, r2), maxR = Math.max(r1, r2);
      for (let r = minR; r <= maxR; r++) {
        if (r === r1 || r === r2) continue;
        if (r < 0 || r >= R || c1 < 0 || c1 >= C) continue;
        if (grid[r][c1] !== null) return false;
      }
      return true;
    }
    return false;
  }

  function canConnect(r1, c1, r2, c2) {
    if (r1 === r2 && c1 === c2) return false;
    if (grid[r1][c1] === null || grid[r2][c2] === null) return false;
    if (grid[r1][c1] !== grid[r2][c2]) return false;

    const R = grid.length, C = grid[0].length;

    if (isLineClear(r1, c1, r2, c2)) {
      animatePath([{r:r1,c:c1},{r:r2,c:c2}]);
      return true;
    }

    if (grid[r1] && grid[r1][c2] === null && isLineClear(r1,c1,r1,c2) && isLineClear(r1,c2,r2,c2)) {
      animatePath([{r:r1,c:c1},{r:r1,c:c2},{r:r2,c:c2}]);
      return true;
    }
    if (grid[r2] && grid[r2][c1] === null && isLineClear(r1,c1,r2,c1) && isLineClear(r2,c1,r2,c2)) {
      animatePath([{r:r1,c:c1},{r:r2,c:c1},{r:r2,c:c2}]);
      return true;
    }

    for (let r = 0; r < R; r++) {
      if (r === r1 || r === r2) continue;
      if (grid[r][c1] === null && grid[r][c2] === null &&
          isLineClear(r1,c1,r,c1) && isLineClear(r,c1,r,c2) && isLineClear(r,c2,r2,c2)) {
        animatePath([{r:r1,c:c1},{r:r,c:c1},{r:r,c:c2},{r:r2,c:c2}]);
        return true;
      }
    }
    for (let c = 0; c < C; c++) {
      if (c === c1 || c === c2) continue;
      if (grid[r1][c] === null && grid[r2][c] === null &&
          isLineClear(r1,c1,r1,c) && isLineClear(r1,c,r2,c) && isLineClear(r2,c,r2,c2)) {
        animatePath([{r:r1,c:c1},{r:r1,c:c},{r:r2,c:c},{r:r2,c:c2}]);
        return true;
      }
    }

    return false;
  }

  function animatePath(points) {
    if (points.length < 2) return;
    const area = document.getElementById('gameArea');
    const oldSvg = area.querySelector('.line-svg');
    if (oldSvg) oldSvg.remove();

    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.classList.add('line-svg');
    svg.style.cssText = 'position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:5;';
    area.appendChild(svg);

    function toXY(pr, pc) {
      const diff = DIFFICULTY[currentDiff];
      const cell = document.querySelector(`.cell[data-r="${pr}"][data-c="${pc}"]`);
      if (cell) {
        const cr = cell.getBoundingClientRect();
        const ar = area.getBoundingClientRect();
        return {x: cr.left - ar.left + cr.width/2, y: cr.top - ar.top + cr.height/2};
      }
      const allCells = area.querySelectorAll('.cell');
      if (allCells.length === 0) return {x:0, y:0};
      const firstRect = allCells[0].getBoundingClientRect();
      const ar = area.getBoundingClientRect();
      const cw = firstRect.width + diff.gap;
      const ch = firstRect.height + diff.gap;
      const innerC = pc - 1, innerR = pr - 1;
      let cx = innerC * cw + firstRect.width/2;
      let cy = innerR * ch + firstRect.height/2;
      if (pr <= 0) cy -= ch;
      if (pr > diff.rows) cy += ch;
      if (pc <= 0) cx -= cw;
      if (pc > diff.cols) cx += cw;
      return {x: cx, y: cy};
    }

    let d = '';
    for (let i = 0; i < points.length; i++) {
      const pt = toXY(points[i].r, points[i].c);
      d += (i === 0 ? 'M' : 'L') + pt.x + ',' + pt.y + ' ';
    }
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('d', d);
    path.setAttribute('stroke', '#9b7ef0');
    path.setAttribute('stroke-width', '3');
    path.setAttribute('stroke-linecap', 'round');
    path.setAttribute('stroke-linejoin', 'round');
    path.setAttribute('fill', 'none');
    path.setAttribute('stroke-dasharray', '8,4');
    path.setAttribute('opacity', '0.8');
    svg.appendChild(path);
    setTimeout(() => svg.remove(), 500);
  }

  function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function generateGrid() {
    const diff = DIFFICULTY[currentDiff];
    const {cols, rows, pool, emptyCells} = diff;
    const totalPlayable = cols * rows;

    const filledCount = totalPlayable - emptyCells;
    const adjustFilled = filledCount % 2 === 0 ? filledCount : filledCount - 1;
    const pairCount = adjustFilled / 2;
    totalPairs = pairCount;

    const totalRows = rows + 2;
    const totalCols = cols + 2;
    grid = Array.from({length: totalRows}, () => Array(totalCols).fill(null));

    const shuffledPool = shuffle(pool);
    const chosenIcons = shuffledPool.slice(0, pairCount);
    let iconsFlat = [];
    for (const icon of chosenIcons) {
      iconsFlat.push(icon, icon);
    }
    iconsFlat = shuffle(iconsFlat);

    const allPlayablePositions = [];
    for (let r = 1; r <= rows; r++) {
      for (let c = 1; c <= cols; c++) {
        allPlayablePositions.push({r, c});
      }
    }
    const shuffledPositions = shuffle(allPlayablePositions);
    const emptyPositions = new Set(
      shuffledPositions.slice(0, emptyCells).map(p => p.r + ',' + p.c)
    );

    let iconIdx = 0;
    for (const pos of shuffledPositions) {
      if (emptyPositions.has(pos.r + ',' + pos.c)) continue;
      if (iconIdx >= iconsFlat.length) break;
      grid[pos.r][pos.c] = iconsFlat[iconIdx++];
    }

    if (!hasAnyValidPair()) {
      generateGrid();
      return;
    }

    matchesFound = 0;
    combo = 0;
    selectedCell = null;
    hintCount = 0;
    updateHUD();
  }

  function hasAnyValidPair() {
    const diff = DIFFICULTY[currentDiff];
    const {rows, cols} = diff;
    const filled = [];
    for (let r = 1; r <= rows; r++) {
      for (let c = 1; c <= cols; c++) {
        if (grid[r][c] !== null) filled.push({r, c});
      }
    }
    for (let i = 0; i < filled.length; i++) {
      for (let j = i + 1; j < filled.length; j++) {
        if (canConnectSilent(filled[i].r, filled[i].c, filled[j].r, filled[j].c)) {
          return true;
        }
      }
    }
    return false;
  }

  function canConnectSilent(r1, c1, r2, c2) {
    if (r1 === r2 && c1 === c2) return false;
    if (grid[r1][c1] === null || grid[r2][c2] === null) return false;
    if (grid[r1][c1] !== grid[r2][c2]) return false;

    const R = grid.length, C = grid[0].length;
    if (isLineClear(r1, c1, r2, c2)) return true;
    if (grid[r1] && grid[r1][c2] === null && isLineClear(r1,c1,r1,c2) && isLineClear(r1,c2,r2,c2)) return true;
    if (grid[r2] && grid[r2][c1] === null && isLineClear(r1,c1,r2,c1) && isLineClear(r2,c1,r2,c2)) return true;
    for (let r = 0; r < R; r++) {
      if (r === r1 || r === r2) continue;
      if (grid[r][c1] === null && grid[r][c2] === null &&
          isLineClear(r1,c1,r,c1) && isLineClear(r,c1,r,c2) && isLineClear(r,c2,r2,c2)) return true;
    }
    for (let c = 0; c < C; c++) {
      if (c === c1 || c === c2) continue;
      if (grid[r1][c] === null && grid[r2][c] === null &&
          isLineClear(r1,c1,r1,c) && isLineClear(r1,c,r2,c) && isLineClear(r2,c,r2,c2)) return true;
    }
    return false;
  }

  function findHintPair() {
    const diff = DIFFICULTY[currentDiff];
    const {rows, cols} = diff;
    const filled = [];
    for (let r = 1; r <= rows; r++) {
      for (let c = 1; c <= cols; c++) {
        if (grid[r][c] !== null) filled.push({r, c});
      }
    }
    for (let i = 0; i < filled.length; i++) {
      for (let j = i + 1; j < filled.length; j++) {
        if (canConnectSilent(filled[i].r, filled[i].c, filled[j].r, filled[j].c)) {
          return [filled[i], filled[j]];
        }
      }
    }
    return null;
  }

  function buildGridDOM() {
    const diff = DIFFICULTY[currentDiff];
    const {cols, rows, iconSize, gap} = diff;
    const area = document.getElementById('gameArea');
    area.innerHTML = '';
    area.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
    area.style.gap = gap + 'px';

    for (let vr = 0; vr < rows; vr++) {
      for (let vc = 0; vc < cols; vc++) {
        const gr = vr + 1;
        const gc = vc + 1;
        const cell = document.createElement('div');
        cell.className = 'cell';
        cell.dataset.r = gr;
        cell.dataset.c = gc;
        cell.style.fontSize = iconSize + 'px';
        cell.style.lineHeight = '1';
        // 医学修正: 中等档轻微灰化(0.85), 困难档全灰度(shape-only)
        if (currentDiff === 'medium') cell.style.filter = 'grayscale(0.35)';
        if (currentDiff === 'hard') cell.style.filter = 'grayscale(0.85) contrast(0.8)';

        if (grid[gr][gc] === null) {
          cell.classList.add('empty');
        } else {
          cell.textContent = grid[gr][gc];
        }

        cell.addEventListener('pointerdown', function(e) {
          e.preventDefault();
          if (!gameRunning) return;
          if (grid[gr][gc] === null) return;
          initAudio();
          handleCellClick(gr, gc);
        });

        area.appendChild(cell);
      }
    }
    updateHUD();
  }

  function getCellDOM(r, c) {
    return document.querySelector(`.cell[data-r="${r}"][data-c="${c}"]`);
  }

  function handleCellClick(r, c) {
    if (grid[r][c] === null) return;

    const cell = getCellDOM(r, c);
    if (!cell) return;

    if (selectedCell === null) {
      selectedCell = {r, c};
      cell.classList.add('selected');
      playSelectSound();
    } else if (selectedCell.r === r && selectedCell.c === c) {
      cell.classList.remove('selected');
      selectedCell = null;
    } else {
      const sr = selectedCell.r, sc = selectedCell.c;
      const prevCell = getCellDOM(sr, sc);

      if (canConnect(sr, sc, r, c)) {
        onMatch(sr, sc, r, c, prevCell, cell);
      } else {
        onMismatch(prevCell, cell);
      }
    }
  }

  function onMatch(sr, sc, r, c, cell1, cell2) {
    matchesFound++;
    combo++;
    if (combo > maxCombo) maxCombo = combo;
    const bonus = combo >= 8 ? 5 : combo >= 5 ? 3 : combo >= 3 ? 2 : 1;
    score += bonus;
    updateHUD();
    playMatchSound();
    if (combo >= 3) { playBeep(440 + combo * 30, 0.08, 0.05); }
    if (combo >= 5) { showComboPop(combo); }

    cell1.classList.remove('selected');
    cell2.classList.remove('selected');
    selectedCell = null;

    cell1.classList.add('matched');
    cell2.classList.add('matched');
    grid[sr][sc] = null;
    grid[r][c] = null;

    setTimeout(() => {
      cell1.style.visibility = 'hidden';
      cell2.style.visibility = 'hidden';
      cell1.textContent = '';
      cell2.textContent = '';
      cell1.classList.add('empty');
      cell2.classList.add('empty');
    }, 400);

    setTimeout(() => {
      if (matchesFound >= totalPairs && gameRunning) {
        showRoundComplete();
        combo = 0;
        generateGrid();
        buildGridDOM();
        updateHUD();
      }
    }, 600);
  }

  function onMismatch(cell1, cell2) {
    wrongAttempts++;
    combo = 0;
    updateHUD();
    playWrongSound();
    cell1.classList.remove('selected');
    selectedCell = null;
    cell2.classList.add('wrong-flash');
    setTimeout(() => cell2.classList.remove('wrong-flash'), 350);
  }

  function showHint() {
    if (!gameRunning) return;
    const pair = findHintPair();
    if (!pair) {
      alert('当前无可连接对，自动换一局～');
      combo = 0;
      generateGrid();
      buildGridDOM();
      updateHUD();
      return;
    }
    hintCount++;
    const c1 = getCellDOM(pair[0].r, pair[0].c);
    const c2 = getCellDOM(pair[1].r, pair[1].c);
    if (c1) c1.classList.add('hinted');
    if (c2) c2.classList.add('hinted');
    setTimeout(() => {
      if (c1) c1.classList.remove('hinted');
      if (c2) c2.classList.remove('hinted');
    }, 1800);
  }

  function showRoundComplete() {
    const msg = document.createElement('div');
    msg.className = 'round-msg';
    msg.style.background = '#45c4a0';
    msg.style.color = '#fff';
    msg.textContent = '全部消除！新一局开始';
    document.body.appendChild(msg);
    setTimeout(() => msg.remove(), 2000);
  }

  function showComboPop(n) {
    // 医学修正: combo弹窗改为右上角小toast，不遮挡游戏区
    const el = document.createElement('div');
    el.style.cssText = 'position:fixed;top:52px;right:16px;z-index:150;'+
      'background:'+(n>=10?'#9b7ef0':n>=7?'#ffa940':'#4da6ff')+';color:#fff;'+
      'padding:6px 14px;border-radius:20px;font-size:13px;font-weight:700;pointer-events:none';
    el.textContent = '🎯 连消 x'+n;
    document.body.appendChild(el);
    setTimeout(function(){el.style.opacity='0';el.style.transition='opacity 0.5s';},2500);
    setTimeout(function(){el.remove();},3000);
  }

  function formatTime(s) {
    const m = Math.floor(s / 60);
    const sec = s % 60;
    return m + ':' + (sec < 10 ? '0' : '') + sec;
  }

  function updateHUD() {
    document.getElementById('barTimer').textContent = formatTime(timeLeft);
  }

  /* ── 游戏控制 ── */
  function startGame() {
    if (gameRunning) return;
    initAudio();
    showPatchReminder();
  }

  function showPatchReminder() {
    const diff = DIFFICULTY[currentDiff];
    document.getElementById('startDiffInfo').innerHTML = `
      难度：<strong>${diff.label}</strong> &nbsp; | &nbsp;
      网格：<strong>${diff.cols}×${diff.rows}</strong> &nbsp; | &nbsp;
      训练时长：<strong>2 分钟</strong><br>
      保持眼睛与屏幕 30~40cm 距离
    `;
    document.getElementById('startOverlay').style.display = 'flex';
  }

  function hideStartOverlay() {
    document.getElementById('startOverlay').style.display = 'none';
  }

  function beginGame() {
    document.getElementById('startOverlay').style.display = 'none';
    document.getElementById('endOverlay').style.display = 'none';
    gameRunning = true;
    score = 0; combo = 0; maxCombo = 0;
    matchesFound = 0; wrongAttempts = 0;
    timeLeft = TOTAL_TIME;
    selectedCell = null;
    updateHUD();
    document.getElementById('barTimer').style.display = 'inline-block';
    document.getElementById('barHint').style.display = 'inline-block';
    document.querySelectorAll('#startOverlay .diff-btn').forEach(b => b.style.pointerEvents = 'auto');

    generateGrid();
    buildGridDOM();

    timerId = setInterval(() => {
      timeLeft--;
      updateHUD();
      if (timeLeft <= 0) endGame();
    }, 1000);
  }

  function endGame() {
    gameRunning = false;
    if (timerId) { clearInterval(timerId); timerId = null; }
    document.getElementById('gameArea').innerHTML = '';
    document.getElementById('barTimer').style.display = 'none';
    document.getElementById('barHint').style.display = 'none';
    selectedCell = null;
    grid = [];

    const total = matchesFound + wrongAttempts;
    const accuracy = total > 0 ? Math.round(matchesFound / total * 100) : 0;
    let grade = accuracy >= 90 ? '优秀' : accuracy >= 70 ? '良好' : accuracy >= 50 ? '继续加油' : '需要更多练习';
    let gradeColor = accuracy >= 90 ? '#45c4a0' : accuracy >= 70 ? '#4da6ff' : accuracy >= 50 ? '#ffa940' : '#ff6b9d';

    document.getElementById('endCard').innerHTML = `
      <div class="result-label">最终得分</div>
      <div class="result-score">${score}</div>
      <div style="font-size:18px;font-weight:700;color:${gradeColor};margin-top:8px;">${grade}</div>
      <div class="result-stat">
        <div class="result-stat-item">
          <div class="result-stat-value" style="color:var(--green);">${matchesFound}</div>
          <div class="result-stat-label">消除对</div>
        </div>
        <div class="result-stat-item">
          <div class="result-stat-value" style="color:var(--text);">${wrongAttempts}</div>
          <div class="result-stat-label">误尝试</div>
        </div>
        <div class="result-stat-item">
          <div class="result-stat-value" style="color:var(--pink);">${accuracy}%</div>
          <div class="result-stat-label">匹配率</div>
        </div>
        <div class="result-stat-item">
          <div class="result-stat-value" style="color:var(--purple);">${maxCombo}</div>
          <div class="result-stat-label">最高连消</div>
        </div>
      </div>
      <div class="rest-reminder">
        <strong>&#x23f0; 休息提醒</strong><br>
        单次训练建议不超过 30 分钟。请让孩子休息 5~10 分钟后再继续。
      </div>
      <button class="btn btn-start" onclick="startGame()" style="margin-right:8px;">再来一局</button>
      <button class="btn" style="background:#fff;color:var(--purple);border:2px solid var(--purple);" onclick="hideEndOverlay()">关闭</button>
    `;
    document.getElementById('endOverlay').style.display = 'flex';

    saveGameResult('matching-game', {score, pairs:matchesFound, combo:maxCombo, difficulty:currentDiff, duration:120});
  }

  function hideEndOverlay() {
    document.getElementById('endOverlay').style.display = 'none';
  }

  function setDifficulty(diff) {
    if (gameRunning) return;
    currentDiff = diff;
    document.querySelectorAll('#startOverlay .diff-btn').forEach(b => {
      b.classList.toggle('active', b.dataset.diff === diff);
    });
    const d = DIFFICULTY[diff];
    document.getElementById('startDiffInfo').innerHTML = `
      难度：<strong>${d.label}</strong> &nbsp; | &nbsp;
      网格：<strong>${d.cols}×${d.rows}</strong> &nbsp; | &nbsp;
      训练时长：<strong>2 分钟</strong><br>
      保持眼睛与屏幕 30~40cm 距离
    `;
    // 更新预览网格
    generateGrid();
    buildGridDOM();
  }

  document.getElementById('diffSelector').addEventListener('click', function(e) {
    if (e.target.classList.contains('diff-btn')) {
      setDifficulty(e.target.dataset.diff);
    }
  });

  // 初始预览
  generateGrid();
  buildGridDOM();
</script>
<script>if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js')}</script>
</body>
